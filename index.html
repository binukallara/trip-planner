
<!-- Trip Planner - All Features (Dark/Light Theme, Weather, Chat, Edit Expense, Budget, Chart, Packing, Share) -->
<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trip Planner</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Firebase SDK (NO AUTH) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
  </script>

  <!-- Leaflet & Routing -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <!-- PDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>

  <!-- Chart.js for Pie Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
  </script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* ========== CSS VARIABLES FOR THEMES ========== */
    :root {
      --bg-primary: #0b0e14;
      --bg-secondary: #171f2a;
      --bg-card: #171f2a;
      --bg-input: #0b1119;
      --bg-hover: #1e2838;
      --bg-chip: #1e293b;
      --text-primary: #eef2f6;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #273340;
      --border-light: #2a364a;
      --shadow-color: rgba(0,0,0,0.3);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.3);
      --input-bg: #0b1119;
      --input-border: #2a364a;
      --input-focus: #3b82f6;
      --scrollbar-track: #1a1f29;
      --scrollbar-thumb: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #facc15;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --purple: #8b5cf6;
      --map-bg: #0b1119;
      --leaflet-zoom-bg: #1e293b;
      --leaflet-zoom-hover: #2d3a4f;
      --leaflet-zoom-color: #e2e8f0;
    }

    [data-theme="light"] {
      --bg-primary: #f1f5f9;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --bg-hover: #e2e8f0;
      --bg-chip: #e2e8f0;
      --text-primary: #0f172a;
      --text-secondary: #1e293b;
      --text-muted: #64748b;
      --border-color: #d1d5db;
      --border-light: #e2e8f0;
      --shadow-color: rgba(0,0,0,0.1);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.1);
      --input-bg: #ffffff;
      --input-border: #d1d5db;
      --input-focus: #3b82f6;
      --scrollbar-track: #e2e8f0;
      --scrollbar-thumb: #3b82f6;
      --map-bg: #f1f5f9;
      --leaflet-zoom-bg: #ffffff;
      --leaflet-zoom-hover: #f1f5f9;
      --leaflet-zoom-color: #0f172a;
    }

    /* ========== RESET & BASE ========== */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-primary); transition: background 0.3s, color 0.3s; }
    #trip-app { max-width: 1400px; margin: 0 auto; padding: 20px; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 8px; }

    /* ========== HEADER & NAV ========== */
    .app-header { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 16px 24px; border-radius: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .app-header h1 { font-size: 22px; font-weight: 700; color: var(--text-primary); }
    .app-header h1 i { color: var(--primary); margin-right: 10px; }
    .app-header .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .app-header .badge { background: var(--bg-chip); padding: 4px 16px; border-radius: 30px; font-size: 13px; color: var(--text-muted); border: 1px solid var(--border-color); }
    .theme-toggle { background: var(--bg-input); border: 1px solid var(--input-border); border-radius: 30px; padding: 6px 14px; color: var(--text-primary); cursor: pointer; font-size: 16px; transition: 0.2s; }
    .theme-toggle:hover { background: var(--bg-hover); }

    .nav-tabs { display: flex; gap: 8px; background: var(--bg-secondary); padding: 8px; border-radius: 16px; margin-bottom: 24px; flex-wrap: wrap; border: 1px solid var(--border-color); overflow-x: auto; }
    .nav-tabs button { background: transparent; border: none; padding: 10px 20px; border-radius: 12px; color: var(--text-muted); font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; flex: 1; min-width: 70px; white-space: nowrap; }
    .nav-tabs button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-tabs button.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }

    /* ========== CARDS & FORMS ========== */
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; margin-bottom: 24px; box-shadow: var(--card-shadow); transition: background 0.3s, border 0.3s; }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: var(--text-secondary); }
    .card h3 i { margin-right: 10px; color: var(--primary); }

    .input-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
    .input-group input, .input-group select, .input-group textarea {
      background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 12px;
      padding: 10px 16px; color: var(--text-primary); font-size: 14px; flex: 1; min-width: 150px;
      transition: 0.2s; outline: none;
    }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
      border-color: var(--input-focus); box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .input-group input::placeholder, .input-group textarea::placeholder { color: var(--text-muted); }
    .input-group button {
      background: var(--primary); border: none; padding: 10px 24px; border-radius: 30px;
      font-weight: 600; color: #fff; cursor: pointer; transition: 0.2s; font-size: 14px;
      white-space: nowrap; display: flex; align-items: center; gap: 8px;
    }
    .input-group button:hover { background: var(--primary-hover); transform: scale(1.02); }
    .input-group button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-danger { background: var(--danger) !important; }
    .btn-danger:hover { background: #dc2626 !important; }
    .btn-success { background: var(--success) !important; }
    .btn-success:hover { background: #059669 !important; }
    .btn-purple { background: var(--purple) !important; }
    .btn-purple:hover { background: #7c3aed !important; }

    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .chip { background: var(--bg-chip); padding: 5px 14px; border-radius: 30px; font-size: 13px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-color); color: var(--text-primary); }
    .chip .remove-chip { cursor: pointer; color: var(--text-muted); font-size: 12px; }
    .chip .remove-chip:hover { color: var(--danger); }

    /* ========== MAP ========== */
    #map { height: 400px; width: 100%; border-radius: 16px; border: 1px solid var(--border-color); background: var(--map-bg); z-index: 1; }
    .leaflet-routing-container { display: none !important; }
    .leaflet-control-zoom a { background: var(--leaflet-zoom-bg) !important; color: var(--leaflet-zoom-color) !important; border-color: var(--border-color) !important; }
    .leaflet-control-zoom a:hover { background: var(--leaflet-zoom-hover) !important; }

    /* ========== NAV INSTRUCTIONS ========== */
    #navInstructions {
      background: var(--bg-secondary);
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      margin-top: 12px;
      color: var(--text-primary);
      max-height: 200px;
      overflow-y: auto;
      font-weight: 400;
      line-height: 1.6;
      min-height: 60px;
    }
    #navInstructions .placeholder { color: var(--text-muted); font-size: 16px; font-weight: 400; text-align: center; display: block; width: 100%; }
    .instruction-step { display: flex; flex-wrap: wrap; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 16px; gap: 4px 10px; }
    .instruction-step:last-child { border-bottom: none; }
    .step-number { color: var(--text-muted); font-weight: 600; min-width: 30px; font-size: 14px; }
    .step-text { flex: 1; }
    .step-distance { color: var(--primary); font-weight: 500; font-size: 13px; background: var(--bg-input); padding: 1px 10px; border-radius: 20px; white-space: nowrap; }

    /* ========== LIST ITEMS ========== */
    .list-item { background: var(--bg-secondary); border-radius: 12px; padding: 14px 18px; border-left: 4px solid var(--primary); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .list-item .info { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .list-item .info .title { font-weight: 600; color: var(--text-primary); }
    .list-item .info .sub { font-size: 13px; color: var(--text-muted); }
    .list-item .amount { font-weight: 700; color: var(--warning); }
    .receipt-thumb { max-width: 80px; max-height: 80px; border-radius: 8px; border: 1px solid var(--border-color); cursor: pointer; object-fit: cover; }
    .receipt-link { color: var(--primary); text-decoration: none; }
    .receipt-link:hover { text-decoration: underline; }

    .settlement-item { background: var(--bg-secondary); border-radius: 12px; padding: 16px 20px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .settlement-item .from { color: var(--danger); font-weight: 700; }
    .settlement-item .to { color: var(--success); font-weight: 700; }
    .settlement-item .s-amount { color: var(--warning); font-weight: 700; font-size: 18px; }

    /* ========== STATS & GRID ========== */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .stat-box { background: var(--bg-secondary); padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); text-align: center; }
    .stat-box .label { color: var(--text-muted); font-size: 13px; }
    .stat-box .value { font-size: 26px; font-weight: 700; color: var(--text-primary); margin-top: 4px; }
    .stat-box .green { color: var(--success); }
    .stat-box .red { color: var(--danger); }
    .stat-box .blue { color: var(--primary); }
    .stat-box .warning { color: var(--warning); }

    /* ========== PROGRESS BAR ========== */
    .progress-container { background: var(--bg-secondary); border-radius: 30px; height: 20px; overflow: hidden; border: 1px solid var(--border-color); margin: 8px 0; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, var(--success), var(--warning), var(--danger)); transition: width 0.5s ease; border-radius: 30px; }
    .progress-text { text-align: center; font-size: 14px; font-weight: 600; margin-top: 4px; color: var(--text-muted); }

    /* ========== PIE CHART ========== */
    #expenseChart { max-height: 250px; max-width: 100%; }

    /* ========== CHAT ========== */
    .chat-container { max-height: 300px; overflow-y: auto; padding: 12px; background: var(--bg-input); border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 12px; }
    .chat-msg { padding: 8px 14px; border-radius: 16px; margin-bottom: 8px; max-width: 80%; word-wrap: break-word; }
    .chat-msg.me { background: var(--primary); color: #fff; margin-left: auto; }
    .chat-msg.other { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); }
    .chat-msg .sender { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 2px; }
    .chat-msg .time { font-size: 10px; color: var(--text-muted); margin-left: 8px; }

    /* ========== PACKING CHECKLIST ========== */
    .packing-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--bg-secondary); border-radius: 10px; margin-bottom: 6px; border: 1px solid var(--border-color); }
    .packing-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }
    .packing-item .item-text { flex: 1; font-size: 14px; }
    .packing-item .item-text.done { text-decoration: line-through; color: var(--text-muted); }
    .packing-item .item-category { font-size: 11px; padding: 2px 10px; border-radius: 20px; background: var(--bg-chip); color: var(--text-muted); }

    /* ========== MODAL ========== */
    .modal-overlay {
      display: none;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 99999;
      justify-content: center; align-items: center;
      animation: fadeIn 0.3s ease;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 24px; padding: 30px; max-width: 500px; width: 90%;
      color: var(--text-primary); box-shadow: 0 20px 60px rgba(0,0,0,0.8);
      max-height: 90vh; overflow-y: auto;
    }
    .modal-box h2 { font-size: 20px; margin-bottom: 16px; }
    .modal-box h2 i { color: var(--primary); margin-right: 10px; }
    .modal-box .input-group { flex-direction: column; align-items: stretch; }
    .modal-box .input-group input, .modal-box .input-group select { width: 100%; }
    .modal-box .btn-group { display: flex; gap: 12px; margin-top: 16px; }
    .modal-box .btn-group button { flex: 1; padding: 12px; border: none; border-radius: 30px; font-weight: 600; cursor: pointer; }
    .modal-box .btn-group .cancel-btn { background: var(--bg-chip); color: var(--text-primary); }
    .modal-box .btn-group .cancel-btn:hover { background: var(--bg-hover); }
    .modal-box .btn-group .save-btn { background: var(--primary); color: #fff; }
    .modal-box .btn-group .save-btn:hover { background: var(--primary-hover); }

    /* ========== AUTH ========== */
    .auth-overlay {
      display: flex;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 99999;
      justify-content: center; align-items: center;
      animation: fadeIn 0.4s ease;
    }
    .auth-box {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 24px; padding: 40px 30px; max-width: 420px; width: 90%;
      text-align: center; color: var(--text-primary);
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }
    .auth-box h2 { font-size: 24px; margin-bottom: 8px; }
    .auth-box h2 i { color: var(--primary); margin-right: 10px; }
    .auth-box p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; }
    .auth-box .input-group { justify-content: center; }
    .auth-box .input-group input {
      text-align: center; font-size: 24px; letter-spacing: 8px; max-width: 180px; padding: 12px;
    }
    .auth-box .btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
    .auth-box .btn-group button { padding: 12px 28px; border: none; border-radius: 30px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; color: #fff; flex: 1; min-width: 120px; }
    .auth-box .btn-group .primary-btn { background: var(--primary); }
    .auth-box .btn-group .primary-btn:hover { background: var(--primary-hover); }
    .auth-box .btn-group .secondary-btn { background: var(--success); }
    .auth-box .btn-group .secondary-btn:hover { background: #059669; }
    .auth-box .error-msg { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 20px; }

    .sync-status { color: var(--text-muted); font-size: 13px; margin-top: 6px; }
    .sync-status.success { color: var(--success); }
    .sync-status.error { color: var(--danger); }

    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ========== WEATHER ========== */
    .weather-cards { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0; }
    .weather-card { background: var(--bg-secondary); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); min-width: 120px; text-align: center; flex-shrink: 0; }
    .weather-card .day { font-weight: 600; font-size: 14px; }
    .weather-card .temp { font-size: 20px; font-weight: 700; }
    .weather-card .desc { font-size: 12px; color: var(--text-muted); }
    .weather-card .icon { font-size: 32px; }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 900px) { 
      .grid-2 { grid-template-columns: 1fr; }
      .grid-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .grid-3 { grid-template-columns: 1fr; }
      .app-header { flex-direction: column; align-items: stretch; text-align: center; }
      .app-header .header-actions { justify-content: center; }
      .input-group { flex-direction: column; align-items: stretch; }
      .auth-box { padding: 30px 20px; }
      .modal-box { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- ========== AUTH / JOIN SCREEN ========== -->
  <div id="authScreen" class="auth-overlay">
    <div class="auth-box">
      <h2><i class="fas fa-plane-departure"></i> Trip Planner</h2>
      <p>Start a new trip or join an existing one with a PIN.</p>
      <div class="input-group">
        <input type="text" id="pinInput" maxlength="4" placeholder="Enter PIN" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div id="authError" class="error-msg"></div>
      <div class="btn-group">
        <button class="secondary-btn" id="joinTripBtn"><i class="fas fa-sign-in-alt"></i> Join Trip</button>
        <button class="primary-btn" id="newTripBtn"><i class="fas fa-plus"></i> New Trip</button>
      </div>
    </div>
  </div>

  <!-- ========== MAIN APP ========== -->
  <div id="trip-app" style="display:none;"></div>

  <!-- ========== EDIT EXPENSE MODAL ========== -->
  <div id="editModal" class="modal-overlay">
    <div class="modal-box">
      <h2><i class="fas fa-edit"></i> Edit Expense</h2>
      <div class="input-group">
        <input type="text" id="editExpDesc" placeholder="Description">
        <input type="number" id="editExpAmount" placeholder="Amount (₹)">
        <select id="editExpPaidBy"><option value="">-- Paid By --</option></select>
        <select id="editExpCategory">
          <option value="Food">🍔 Food</option>
          <option value="Travel">🚗 Travel</option>
          <option value="Stay">🏨 Stay</option>
          <option value="Shopping">🛍️ Shopping</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="cancel-btn" onclick="closeEditModal()">Cancel</button>
        <button class="save-btn" onclick="saveEditExpense()"><i class="fas fa-save"></i> Save</button>
      </div>
    </div>
  </div>

  <script>
    // ======================================================
    // 1. FIREBASE CONFIG
    // ======================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDHFcRRJo_OzuPla9TTLQKTqP0psyrVU1Y",
      authDomain: "trip-planner-cacaf.firebaseapp.com",
      databaseURL: "https://trip-planner-cacaf-default-rtdb.firebaseio.com",
      projectId: "trip-planner-cacaf",
      storageBucket: "trip-planner-cacaf.firebasestorage.app",
      messagingSenderId: "829860320918",
      appId: "1:829860320918:web:4062460a825314a49414b7",
      measurementId: "G-0MX66HVEK7"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentTripPin = null;
    let isSyncing = false;
    let isLocalUpdate = false;
    let mapInstance = null;
    let mapMarkers = [];
    let mapPolyline = null;
    let routingControl = null;
    let userMarker = null;
    let tempMarker = null;
    let watchId = null;
    let isNavigating = false;
    let editExpenseIdx = null;
    let chartInstance = null;
    let currentTheme = 'dark';

    // ======================================================
    // 2. APP DATA
    // ======================================================
    let appData = {
      tripName: 'New Trip',
      tripDate: new Date().toISOString().split('T')[0],
      participants: [],
      itinerary: [],
      expenses: [],
      packing: { personal: [], common: [] },
      budget: 0,
      createdAt: Date.now()
    };

    // ======================================================
    // 3. HELPERS
    // ======================================================
    function generateId() { return Date.now() + Math.random().toString(36); }

    function updateSyncStatus(msg, isError = false) {
      const el = document.getElementById('syncStatus');
      if (!el) return;
      el.textContent = msg;
      el.className = 'sync-status ' + (isError ? 'error' : 'success');
      console.log('🔔 Sync Status:', msg);
    }

    // ======================================================
    // 4. THEME TOGGLE
    // ======================================================
    function toggleTheme() {
      currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
      const btn = document.getElementById('themeToggleBtn');
      if (btn) btn.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    }

    function loadTheme() {
      const saved = localStorage.getItem('theme');
      if (saved) {
        currentTheme = saved;
        document.documentElement.setAttribute('data-theme', saved);
      }
    }

    // ======================================================
    // 5. FIREBASE SYNC
    // ======================================================
    function syncToFirebase() {
      if (!currentTripPin) {
        updateSyncStatus('❌ No active PIN', true);
        return;
      }
      isLocalUpdate = true;
      if (!appData.createdAt) appData.createdAt = firebase.database.ServerValue.TIMESTAMP;
      database.ref('trips/' + currentTripPin).set(appData)
        .then(() => {
          isLocalUpdate = false;
          updateSyncStatus('✅ Synced');
          setTimeout(() => {
            const el = document.getElementById('syncStatus');
            if (el) el.textContent = 'Real-time sync enabled 🔄';
          }, 2000);
        })
        .catch(err => {
          isLocalUpdate = false;
          console.error('❌ Sync error:', err);
          updateSyncStatus('❌ Sync failed: ' + err.message, true);
        });
    }

    function startRealtimeListener(pin) {
      if (isSyncing) return;
      isSyncing = true;
      database.ref('trips/' + pin).on('value', (snapshot) => {
        if (!snapshot.exists()) {
          localStorage.removeItem('tripPin');
          localStorage.removeItem('tripData');
          alert('Trip deleted from server.');
          window.location.reload();
          return;
        }
        const remoteData = snapshot.val();
        if (isLocalUpdate) { isLocalUpdate = false; return; }
        appData = {
          ...remoteData,
          participants: remoteData.participants || [],
          itinerary: remoteData.itinerary || [],
          expenses: remoteData.expenses || [],
          packing: remoteData.packing || { personal: [], common: [] },
          budget: remoteData.budget || 0
        };
        localStorage.setItem('tripData', JSON.stringify(appData));
        reRenderAll();
      }, (error) => {
        console.error('Listener error:', error);
      });
    }

    // ======================================================
    // 6. TRIP CREATE / JOIN
    // ======================================================
    function showAuthScreen() {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('trip-app').style.display = 'none';
    }
    function hideAuthScreen() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('trip-app').style.display = 'block';
    }
    function setError(msg) { document.getElementById('authError').textContent = msg; }
    function clearError() { document.getElementById('authError').textContent = ''; }
    function generatePin() { return String(Math.floor(1000 + Math.random() * 9000)); }

    function createNewTrip() {
      clearError();
      const pin = generatePin();
      const newTripData = {
        tripName: 'My Trip',
        tripDate: new Date().toISOString().split('T')[0],
        participants: [],
        itinerary: [],
        expenses: [],
        packing: { personal: [], common: [] },
        budget: 0,
        createdAt: firebase.database.ServerValue.TIMESTAMP
      };
      database.ref('trips/' + pin).set(newTripData)
        .then(() => {
          currentTripPin = pin;
          appData = newTripData;
          localStorage.setItem('tripData', JSON.stringify(appData));
          localStorage.setItem('tripPin', pin);
          hideAuthScreen();
          buildUI();
          startRealtimeListener(pin);
          setTimeout(() => showShareModal(pin), 500);
        })
        .catch(err => {
          console.error(err);
          setError('Error: ' + err.message);
        });
    }

    function joinTrip() {
      clearError();
      const pin = document.getElementById('pinInput').value.trim();
      if (!pin || pin.length !== 4 || isNaN(pin)) {
        setError('Enter a valid 4-digit PIN.');
        return;
      }
      database.ref('trips/' + pin).once('value')
        .then(snapshot => {
          if (!snapshot.exists()) {
            setError('Trip not found.');
            return;
          }
          const data = snapshot.val();
          data.participants = data.participants || [];
          data.itinerary = data.itinerary || [];
          data.expenses = data.expenses || [];
          data.packing = data.packing || { personal: [], common: [] };
          data.budget = data.budget || 0;
          currentTripPin = pin;
          appData = data;
          localStorage.setItem('tripData', JSON.stringify(appData));
          localStorage.setItem('tripPin', pin);
          hideAuthScreen();
          buildUI();
          startRealtimeListener(pin);
        })
        .catch(err => {
          console.error(err);
          setError('Error: ' + err.message);
        });
    }

    // ======================================================
    // 7. SHARING FUNCTIONS (SMS / WhatsApp)
    // ======================================================
    function shareViaWhatsApp(pin) {

      const msg = encodeURIComponent(`✈️ Trip Planner\nJoin my trip with PIN: ${pin}\nLink: ${url}`);

    function updateStats() {
      const participants = appData.participants || [];

      document.getElementById('dashParticipantCount').innerText = participants.length;
      const total = expenses.reduce((s, e) => s + parseFloat(e.amount), 0);
      document.getElementById('dashTotalCost').innerHTML = '₹' + total.toFixed(2);

      updateBudgetUI();

    // ======================================================
    // 9. BUDGET UI
    // ======================================================
    function updateBudgetUI() {
      const budget = appData.budget || 0;
      const total = (appData.expenses || []).reduce((s, e) => s + parseFloat(e.amount), 0);
      const percent = budget > 0 ? Math.min((total / budget) * 100, 100) : 0;
      const remaining = budget - total;

      const el = document.getElementById('budgetDisplay');
      if (!el) return;
      el.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
          <span>💰 Budget: ₹${budget.toFixed(2)}</span>
          <span>Spent: ₹${total.toFixed(2)}</span>
          <span>Remaining: ₹${remaining.toFixed(2)}</span>
        </div>
        <div class="progress-container">
          <div class="progress-bar" style="width:${percent}%;"></div>
        </div>
        <div class="progress-text">${percent.toFixed(1)}% used</div>
      `;
    }

    // ======================================================
    // 10. PIE CHART (Chart.js)
    // ======================================================
    function updateChart() {
      const canvas = document.getElementById('expenseChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      // Destroy old chart
      if (chartInstance) {
        chartInstance.destroy();
        chartInstance = null;
      }

      const expenses = appData.expenses || [];
      if (expenses.length === 0) {
        document.getElementById('chartContainer').innerHTML = '<div style="color:var(--text-muted);padding:20px;text-align:center;">Add expenses to see chart.</div>';
        return;
      }

      // Group by category
      const categories = { Food: 0, Travel: 0, Stay: 0, Shopping: 0, Other: 0 };
      expenses.forEach(exp => {
        const cat = exp.category || 'Other';
        if (categories[cat] !== undefined) categories[cat] += parseFloat(exp.amount);
        else categories['Other'] += parseFloat(exp.amount);
      });

      const labels = Object.keys(categories).filter(k => categories[k] > 0);
      const data = labels.map(k => categories[k]);
      const colors = ['#3b82f6', '#10b981', '#facc15', '#8b5cf6', '#ef4444'];
      const emojis = { Food: '🍔', Travel: '🚗', Stay: '🏨', Shopping: '🛍️', Other: '📦' };

      const container = document.getElementById('chartContainer');
      container.innerHTML = '<canvas id="expenseChart" style="max-height:250px;max-width:100%;"></canvas>';

      const newCanvas = document.getElementById('expenseChart');
      const newCtx = newCanvas.getContext('2d');

      chartInstance = new Chart(newCtx, {
        type: 'doughnut',
        data: {
          labels: labels.map(l => `${emojis[l] || '📦'} ${l}`),
          datasets: [{
            data: data,
            backgroundColor: colors.slice(0, labels.length),
            borderColor: 'var(--bg-card)',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: 'var(--text-primary)', font: { size: 12 } }
            }
          }
        }
      });
    }

    // ======================================================
    // 11. WEATHER FORECAST
    // ======================================================
    function fetchWeather() {
      const container = document.getElementById('weatherContainer');
      container.innerHTML = '<div style="color:var(--text-muted);">Loading weather...</div>';

      const places = appData.itinerary || [];
      if (places.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted);">Add places to see weather forecast.</div>';
        return;
      }

      // Use the first place for weather
      const place = places[0];
      const lat = parseFloat(place.lat);
      const lng = parseFloat(place.lng);
      if (isNaN(lat) || isNaN(lng)) {
        container.innerHTML = '<div style="color:var(--text-muted);">Invalid coordinates for weather.</div>';
        return;
      }

      // OpenWeatherMap API (free tier) - using demo key, user should replace
      const apiKey = 'YOUR_OPENWEATHER_API_KEY'; // Replace with actual key
      const url = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lng}&units=metric&appid=${apiKey}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data.cod !== '200') {
            container.innerHTML = `<div style="color:var(--text-muted);">Weather API error: ${data.message || 'Unknown'}</div>`;
            return;
          }

          // Get daily forecasts (every 8th entry = 24 hours)
          const daily = data.list.filter((item, idx) => idx % 8 === 0).slice(0, 5);
          let html = '<div class="weather-cards">';
          const days = ['Today', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
          daily.forEach((item, idx) => {
            const date = new Date(item.dt * 1000);
            const dayName = idx === 0 ? 'Today' : days[date.getDay()];
            const temp = Math.round(item.main.temp);
            const desc = item.weather[0].description;
            const icon = item.weather[0].icon;
            const iconUrl = `https://openweathermap.org/img/wn/${icon}@2x.png`;
            html += `
              <div class="weather-card">
                <div class="day">${dayName}</div>
                <div><img src="${iconUrl}" alt="${desc}" style="width:50px;height:50px;" /></div>
                <div class="temp">${temp}°C</div>
                <div class="desc">${desc}</div>
              </div>
            `;
          });
          html += '</div>';
          container.innerHTML = html;
        })
        .catch(err => {
          console.error('Weather error:', err);
          container.innerHTML = '<div style="color:var(--text-muted);">Failed to fetch weather. Check API key.</div>';
        });
    }

    // ======================================================
    // 12. CHAT
    // ======================================================
    function renderChat() {
      const container = document.getElementById('chatMessages');
      if (!container) return;
      const messages = appData.chatMessages || [];

      }

        <div class="chat-msg ${msg.sender === sender ? 'me' : 'other'}">

          <span class="time">${new Date(msg.timestamp).toLocaleTimeString()}</span>
        </div>
      `).join('');

    function sendChatMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      const sender = localStorage.getItem('chatUser') || 'You';
      if (sender === 'You') {
        const name = prompt('Enter your name for chat:');
        if (name) localStorage.setItem('chatUser', name);
        else return;
      }
      const messages = appData.chatMessages || [];
      messages.push({ sender: localStorage.getItem('chatUser') || 'You', text, timestamp: Date.now() });
      appData.chatMessages = messages;
      input.value = '';
      renderChat();
      syncToFirebase();
    }

    // ======================================================
    // 13. PACKING CHECKLIST
    // ======================================================
    function renderPacking() {
      const personal = appData.packing?.personal || [];
      const common = appData.packing?.common || [];

      const container = document.getElementById('packingList');
      if (!container) return;

      const renderItems = (items, type) => items.map((item, idx) => `
        <div class="packing-item">
          <input type="checkbox" ${item.done ? 'checked' : ''} onchange="togglePacking('${type}', ${idx})" />
          <span class="item-text ${item.done ? 'done' : ''}">${item.text}</span>
          <span class="item-category">${type === 'personal' ? '👤 Personal' : '👥 Common'}</span>
          <button class="btn-danger" style="border:none;padding:2px 10px;border-radius:20px;color:#fff;cursor:pointer;font-size:12px;" onclick="removePacking('${type}', ${idx})"><i class="fas fa-times"></i></button>
        </div>
      `).join('');

      container.innerHTML = `
        <div style="margin-bottom:12px;">
          <strong>👤 Personal Items</strong>
          <div>${renderItems(personal, 'personal') || '<div style="color:var(--text-muted);padding:8px;">No personal items.</div>'}</div>
        </div>
        <div>
          <strong>👥 Common Items</strong>
          <div>${renderItems(common, 'common') || '<div style="color:var(--text-muted);padding:8px;">No common items.</div>'}</div>
        </div>
      `;
    }

    function addPackingItem() {
      const input = document.getElementById('packingInput');
      const text = input.value.trim();
      const type = document.getElementById('packingType').value;
      if (!text) return;
      if (!appData.packing) appData.packing = { personal: [], common: [] };
      appData.packing[type].push({ text, done: false });
      input.value = '';
      renderPacking();
      syncToFirebase();
    }

    function togglePacking(type, idx) {
      if (!appData.packing) return;
      appData.packing[type][idx].done = !appData.packing[type][idx].done;
      renderPacking();
      syncToFirebase();
    }

    function removePacking(type, idx) {
      if (!appData.packing) return;
      appData.packing[type].splice(idx, 1);
      renderPacking();
      syncToFirebase();
    }

    // ======================================================
    // 14. EDIT EXPENSE
    // ======================================================
    function openEditModal(idx) {
      const exp = appData.expenses[idx];
      if (!exp) return;
      editExpenseIdx = idx;
      document.getElementById('editExpDesc').value = exp.desc || '';
      document.getElementById('editExpAmount').value = exp.amount || '';
      document.getElementById('editExpPaidBy').value = exp.paidBy || '';
      document.getElementById('editExpCategory').value = exp.category || 'Other';
      document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('active');
      editExpenseIdx = null;
    }

    function saveEditExpense() {
      if (editExpenseIdx === null) return;
      const desc = document.getElementById('editExpDesc').value.trim();
      const amount = parseFloat(document.getElementById('editExpAmount').value);
      const paidBy = document.getElementById('editExpPaidBy').value;
      const category = document.getElementById('editExpCategory').value;

      if (!desc) { alert('Enter description.'); return; }
      if (isNaN(amount) || amount <= 0) { alert('Enter valid amount.'); return; }
      if (!paidBy) { alert('Select who paid.'); return; }

      appData.expenses[editExpenseIdx] = {
        ...appData.expenses[editExpenseIdx],
        desc, amount, paidBy, category
      };
      closeEditModal();
      renderExpenses();
      syncToFirebase();
    }

    // ======================================================
    // 15. PUSH NOTIFICATIONS (Browser)
    // ======================================================
    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        alert('Notifications not supported in this browser.');
        return;
      }
      if (Notification.permission === 'granted') {
        alert('✅ Notifications already enabled.');
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === 'granted') {
          alert('✅ Notifications enabled!');
          showNotification('🔔 Notifications enabled', 'You will get updates about your trip.');
        } else {
          alert('❌ Notification permission denied.');
        }
      });
    }

    function showNotification(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      new Notification(title, {
        body: body || '',
        icon: 'https://raw.githubusercontent.com/binukallara/trip-planner/refs/heads/main/icon-192.png',
        vibrate: [200, 100, 200]
      });
    }

    // ======================================================
    // 16. MAP FUNCTIONS
    // ======================================================
    function initMap() {
      const defaultLoc = [10.089, 77.059];
      if (typeof L === 'undefined') {
        document.getElementById('map').innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger);">⚠️ Leaflet library not loaded.</div>';
        return;
      }
      if (mapInstance) { mapInstance.remove();
        mapInstance = null; }
      mapInstance = L.map('map', { center: defaultLoc, zoom: 10, zoomControl: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(mapInstance);
      L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
      mapInstance.on('click', function(e) {
        document.getElementById('placeLat').value = e.latlng.lat.toFixed(6);
        document.getElementById('placeLng').value = e.latlng.lng.toFixed(6);
        if (tempMarker) mapInstance.removeLayer(tempMarker);
        tempMarker = L.marker(e.latlng, { draggable: true })
          .addTo(mapInstance)
          .bindPopup(`Lat: ${e.latlng.lat.toFixed(6)}<br>Lng: ${e.latlng.lng.toFixed(6)}`)
          .openPopup();
        tempMarker.on('dragend', function() {
          const pos = tempMarker.getLatLng();
          document.getElementById('placeLat').value = pos.lat.toFixed(6);
          document.getElementById('placeLng').value = pos.lng.toFixed(6);
        });
      });
      if (isNavigating) startLiveTracking();
      updateMapMarkers();
    }

    function updateMapMarkers() {
      if (!mapInstance) return;
      mapMarkers.forEach(m => { if (mapInstance.hasLayer(m)) mapInstance.removeLayer(m); });
      mapMarkers = [];
      if (routingControl) { mapInstance.removeControl(routingControl);
        routingControl = null; }
      const itinerary = appData.itinerary || [];
      if (itinerary.length === 0) {
        mapInstance.setView([10.089, 77.059], 10);
        document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Add places to see route.</span>';
        return;
      }
      const waypoints = [];
      const latlngs = [];
      itinerary.forEach((item) => {
        const lat = parseFloat(item.lat);
        const lng = parseFloat(item.lng);
        if (isNaN(lat) || isNaN(lng)) return;
        const pos = [lat, lng];
        latlngs.push(pos);
        waypoints.push(L.latLng(lat, lng));
        const marker = L.marker(pos, { title: item.name })
          .bindPopup(`<b>${item.name}</b><br>${item.desc || ''}`)
          .addTo(mapInstance);
        mapMarkers.push(marker);
      });
      if (latlngs.length === 1) {
        mapInstance.setView(latlngs[0], 12);
      } else if (latlngs.length > 1) {
        try {
          routingControl = L.Routing.control({
            waypoints: waypoints,
            routeWhileDragging: false,
            showAlternatives: false,
            fitSelectedRoutes: true,
            addWaypoints: false,
            draggableWaypoints: false,
            show: false,
            createMarker: function() { return null; },
            lineOptions: { styles: [{ color: '#3b82f6', weight: 4, opacity: 0.8 }] },
            router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' })
          }).addTo(mapInstance);
          routingControl.on('routesfound', function(e) {
            const routes = e.routes;
            if (!routes || routes.length === 0) {
              document.getElementById('navInstructions').innerHTML = '<span class="placeholder">No route found.</span>';
              return;
            }
            const route = routes[0];
            let instructions = [];
            if (route.legs && route.legs.length > 0) {
              route.legs.forEach(leg => { if (leg.steps) instructions = instructions.concat(leg.steps); });
            } else if (route.steps) {
              instructions = route.steps;
            }
            let html = '';
            instructions.forEach((step, idx) => {
              let text = step.instruction || step.text || step.name || '';
              let dist = step.distance || 0;
              let distStr = dist > 0 ? (dist >= 1000 ? (dist / 1000).toFixed(1) + ' km' : Math.round(dist) + ' m') : '';
              html += `<div class="instruction-step"><span class="step-number">${idx + 1}.</span><span class="step-text">${text}</span>${distStr ? `<span class="step-distance">${distStr}</span>` : ''}</div>`;
            });
            document.getElementById('navInstructions').innerHTML = html || '<span class="placeholder">No instructions available.</span>';
          });
          routingControl.on('routingerror', function(e) {
            document.getElementById('navInstructions').innerHTML = '<span style="color:var(--danger);">❌ Could not calculate route.</span>';
          });
          setTimeout(() => { if (routingControl) routingControl.route(); }, 500);
        } catch (e) {
          console.error('Routing error:', e);
          mapPolyline = L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.8 }).addTo(mapInstance);
          const bounds = L.latLngBounds(latlngs);
          mapInstance.fitBounds(bounds, { padding: [30, 30] });
        }
      }
      if (userMarker && !mapInstance.hasLayer(userMarker)) userMarker.addTo(mapInstance);
    }

    // ======================================================
    // 17. NAVIGATION
    // ======================================================
    function startLiveTracking() {
      if (!navigator.geolocation) { document.getElementById('locationStatus').innerHTML = '❌ GPS not supported.'; return; }
      if (watchId) { navigator.geolocation.clearWatch(watchId);
        watchId = null; }
      document.getElementById('locationStatus').innerHTML = '📍 GPS Active...';
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude,
            lng = pos.coords.longitude;
          document.getElementById('locationStatus').innerHTML = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          if (mapInstance) {
            if (userMarker) { userMarker.setLatLng([lat, lng]); } else {
              const icon = L.divIcon({
                className: 'fa-solid fa-location-dot',
                iconSize: [24, 24],
                html: '<i class="fas fa-location-dot" style="color:#3b82f6;font-size:28px;text-shadow:0 0 10px rgba(59,130,246,0.5);"></i>'
              });
              userMarker = L.marker([lat, lng], { icon: icon, title: 'You are here' }).addTo(mapInstance).bindPopup('📍 You are here!');
            }
            if (isNavigating) mapInstance.flyTo([lat, lng], 15, { duration: 1 });
          }
        },
        (err) => { document.getElementById('locationStatus').innerHTML = `❌ GPS Error: ${err.message}`;
          watchId = null; }, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        }
      );
    }

    function stopLiveTracking() {
      if (watchId) { navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById('locationStatus').innerHTML = '⏹️ GPS stopped.'; }
      if (userMarker && mapInstance) { mapInstance.removeLayer(userMarker);
        userMarker = null; }
    }

    function toggleNavigation() {
      if (isNavigating) {
        isNavigating = false;
        stopLiveTracking();
        document.getElementById('navToggleBtn').innerHTML = '<i class="fas fa-play"></i> Start Navigation';
        document.getElementById('navToggleBtn').className = 'btn-success';
        document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Navigation stopped.</span>';
        return;
      }
      const itinerary = appData.itinerary || [];
      if (itinerary.length < 2) {
        alert('Add at least 2 places for navigation.');
        return;
      }
      isNavigating = true;
      document.getElementById('navToggleBtn').innerHTML = '<i class="fas fa-stop"></i> Stop Navigation';
      document.getElementById('navToggleBtn').className = 'btn-danger';
      if (!watchId) startLiveTracking();
      else if (userMarker) { const latlng = userMarker.getLatLng();
        mapInstance.flyTo(latlng, 15, { duration: 1 }); }
      if (routingControl) routingControl.route();
    }

    function searchPlace() {
      const query = document.getElementById('placeName').value.trim();
      if (!query) { alert('Enter a place name.'); return; }
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
      document.getElementById('searchStatus').innerHTML = '🔍 Searching...';
      fetch(url).then(res => res.json()).then(data => {
        if (data && data.length > 0) {
          const result = data[0];
          document.getElementById('placeName').value = result.display_name || query;
          document.getElementById('placeLat').value = parseFloat(result.lat).toFixed(6);
          document.getElementById('placeLng').value = parseFloat(result.lon).toFixed(6);
          document.getElementById('searchStatus').innerHTML = '✅ Found!';
          if (mapInstance) {
            if (tempMarker) mapInstance.removeLayer(tempMarker);
            tempMarker = L.marker([result.lat, result.lon], { draggable: true })
              .addTo(mapInstance)
              .bindPopup(`Lat: ${parseFloat(result.lat).toFixed(6)}<br>Lng: ${parseFloat(result.lon).toFixed(6)}`)
              .openPopup();
            mapInstance.setView([result.lat, result.lon], 13);
            tempMarker.on('dragend', function() {
              const pos = tempMarker.getLatLng();
              document.getElementById('placeLat').value = pos.lat.toFixed(6);
              document.getElementById('placeLng').value = pos.lng.toFixed(6);
            });
          }
        } else {
          document.getElementById('searchStatus').innerHTML = '❌ Not found. Try manual.';
        }
      }).catch(() => { document.getElementById('searchStatus').innerHTML = '❌ Search failed.'; });
    }

    // ======================================================
    // 20. SETTLEMENT
    // ======================================================
    function calculateSettlements() {
      const container = document.getElementById('settlementTransactions');
      const summary = document.getElementById('settlementSummary');
      const participants = appData.participants || [];
      const expenses = appData.expenses || [];
      if (participants.length === 0) { container.innerHTML = '<div style="color:var(--danger);">Add participants first!</div>'; return; }
      if (expenses.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);">No expenses to settle.</div>'; return; }

      const totalPaid = {};
      participants.forEach(p => totalPaid[p] = 0);
      expenses.forEach(exp => {
        const amt = parseFloat(exp.amount);
        if (totalPaid[exp.paidBy] !== undefined) totalPaid[exp.paidBy] += amt;
      });
      const totalCost = expenses.reduce((s, e) => s + parseFloat(e.amount), 0);
      const share = participants.length > 0 ? totalCost / participants.length : 0;
      const netBalance = {};
      participants.forEach(p => { netBalance[p] = totalPaid[p] - share; });

      summary.innerHTML = `
        <div class="stat-box"><div class="label">Total Cost</div><div class="value blue">₹${totalCost.toFixed(2)}</div></div>
        <div class="stat-box"><div class="label">Per Person Share</div><div class="value">₹${share.toFixed(2)}</div></div>
        ${participants.map(p => `
          <div class="stat-box">
            <div class="label">${p} (Paid ₹${totalPaid[p].toFixed(2)})</div>
            <div class="value ${netBalance[p] >= 0 ? 'green' : 'red'}">${netBalance[p] >= 0 ? '+' : ''}${netBalance[p].toFixed(2)}</div>
          </div>
        `).join('')}
      `;

      let payers = participants.filter(p => netBalance[p] < 0).map(p => ({ name: p, amount: -netBalance[p] }));
      let receivers = participants.filter(p => netBalance[p] > 0).map(p => ({ name: p, amount: netBalance[p] }));
      let transactions = [];
      let i = 0,
        j = 0;
      while (i < payers.length && j < receivers.length) {
        let payer = payers[i],
          receiver = receivers[j];
        let settleAmt = Math.min(payer.amount, receiver.amount);
        if (settleAmt > 0.01) { transactions.push({ from: payer.name, to: receiver.name, amount: settleAmt }); }
        payer.amount -= settleAmt;
        receiver.amount -= settleAmt;
        if (payer.amount < 0.01) i++;
        if (receiver.amount < 0.01) j++;
      }

      if (transactions.length === 0) {
        container.innerHTML = '<div style="color:var(--success);font-weight:600;">✅ All settled!</div>';
      } else {
        container.innerHTML = transactions.map(t => `
          <div class="settlement-item">
            <div><span class="from">${t.from}</span> <i class="fas fa-arrow-right" style="color:var(--text-muted);margin:0 12px;"></i> <span class="to">${t.to}</span></div>
            <div class="s-amount">₹${t.amount.toFixed(2)}</div>
          </div>
        `).join('');
      }
    }

      html2canvas(tempDiv, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, width: 750, height: tempDiv
          .scrollHeight }).then(canvas => {
        let jsPDFConstructor = null;
        if (window.jspdf && typeof window.jspdf.jsPDF === 'function') jsPDFConstructor = window.jspdf.jsPDF;
        else if (window.jsPDF && typeof window.jsPDF === 'function') jsPDFConstructor = window.jsPDF;
        else if (typeof jsPDF === 'function') jsPDFConstructor = jsPDF;
        if (!jsPDFConstructor) { document.body.removeChild(tempDiv);
          alert('jsPDF not found.'); return; }
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const doc = new jsPDFConstructor('p', 'mm', 'a4');
        const pdfWidth = 210;
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        doc.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        doc.save(`Settlement_${appData.tripName || 'Trip'}.pdf`);
        document.body.removeChild(tempDiv);
      }).catch(err => { console.error(err);
        document.body.removeChild(tempDiv);
        alert('PDF generation failed: ' + err.message); });
    }

    // ======================================================
    // 22. NAVIGATION TABS
    // ======================================================
    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.nav-tabs button').forEach(b => { if (b.dataset.page === pageId) b.classList.add('active'); });
      if (pageId === 'itinerary' && mapInstance) { setTimeout(() => mapInstance.invalidateSize(), 100); }
      if (pageId === 'settlements') calculateSettlements();
      if (pageId === 'weather') fetchWeather();
      if (pageId === 'chart') setTimeout(updateChart, 200);
    }

    function startNewTrip() {
      if (!confirm('Clear all data and start a new trip?')) return;
      if (isSyncing) { database.ref('trips/' + currentTripPin).off();
        isSyncing = false; }
      localStorage.removeItem('tripData');
      localStorage.removeItem('tripPin');
      currentTripPin = null;
      appData = { tripName: 'New Trip', tripDate: new Date().toISOString().split('T')[0], participants: [], itinerary: [],
        expenses: [], packing: { personal: [], common: [] }, budget: 0, createdAt: Date.now() };
      document.getElementById('trip-app').innerHTML = '';
      document.getElementById('trip-app').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('pinInput').value = '';
    }

            <span style="color:var(--text-muted);font-size:13px;margin-left:12px;">Get alerts for new expenses</span>
          </div>

      document.getElementById('addPlaceBtn').addEventListener('click', addPlace);
      document.getElementById('searchPlaceBtn').addEventListener('click', searchPlace);
      document.getElementById('placeName').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchPlace(); });
      document.getElementById('addExpenseBtn').addEventListener('click', addExpense);
      document.getElementById('updateTripBtn').addEventListener('click', updateTrip);
      document.getElementById('startNewTripBtn').addEventListener('click', startNewTrip);
      document.getElementById('calculateSettleBtn').addEventListener('click', calculateSettlements);
      document.getElementById('downloadPdfBtn').addEventListener('click', exportPDF);
      document.getElementById('trackLocationBtn').addEventListener('click', function() { startLiveTracking(); });
      document.getElementById('navToggleBtn').addEventListener('click', toggleNavigation);
      document.getElementById('sendChatBtn').addEventListener('click', sendChatMessage);
      document.getElementById('chatInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });
      document.getElementById('addPackingBtn').addEventListener('click', addPackingItem);
      document.getElementById('packingInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') addPackingItem(); });
      document.getElementById('setBudgetBtn').addEventListener('click', setBudget);

      // Delegation for remove buttons
      document.getElementById('expenseList').addEventListener('click', function(e) {
        const target = e.target.closest('[data-action="removeExpense"]');
        if (target) { removeExpense(parseInt(target.dataset.idx)); }
      });
      document.getElementById('participantChips').addEventListener('click', function(e) {

    // ======================================================

    // ======================================================
    document.getElementById('newTripBtn').addEventListener('click', createNewTrip);
    document.getElementById('joinTripBtn').addEventListener('click', joinTrip);
    document.getElementById('pinInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('joinTripBtn').click();

    // Load saved theme
    loadTheme();

    const savedPin = localStorage.getItem('tripPin');
    if (savedPin) {
      document.getElementById('pinInput').value = savedPin;
      setTimeout(() => { document.getElementById('joinTripBtn').click(); }, 500);
    }

    // ======================================================
    // 25. SERVICE WORKER (PWA)
    // ======================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registered.'))
        .catch(err => console.log('SW registration failed:', err));
    }
  </script>
</body>
</html>
