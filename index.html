<!-- Trip Planner - All Features + Toast Notifications -->
<!DOCTYPE html>
<html lang="ml" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trip Planner</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f1f5f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <!-- ORS Plugin -->
  <script src="https://unpkg.com/lrm-openrouteservice@1.0.0/dist/lrm-openrouteservice.js"></script>

  <!-- PDF, Chart, FontAwesome -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* ============================================================
       CSS VARIABLES (Light default, Dark via [data-theme="dark"])
    ============================================================ */
    :root {
      --bg-primary: #f1f5f9;
      --bg-secondary: #ffffff;
      --bg-card: #ffffff;
      --bg-input: #f8fafc;
      --bg-hover: #e2e8f0;
      --bg-chip: #e2e8f0;
      --bg-sidebar: #0f172a;
      --bg-sidebar-hover: #1e293b;
      --text-primary: #0f172a;
      --text-secondary: #1e293b;
      --text-muted: #64748b;
      --text-sidebar: #94a3b8;
      --text-sidebar-active: #ffffff;
      --border-color: #d1d5db;
      --border-light: #e2e8f0;
      --shadow-color: rgba(0,0,0,0.1);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.1);
      --input-focus: #3b82f6;
      --scrollbar-track: #e2e8f0;
      --scrollbar-thumb: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #facc15;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --purple: #8b5cf6;
      --map-bg: #f1f5f9;
      --leaflet-zoom-bg: #ffffff;
      --leaflet-zoom-hover: #f1f5f9;
      --leaflet-zoom-color: #0f172a;
      --sidebar-width: 220px;
    }

    [data-theme="dark"] {
      --bg-primary: #0b0e14;
      --bg-secondary: #171f2a;
      --bg-card: #171f2a;
      --bg-input: #0b1119;
      --bg-hover: #1e2838;
      --bg-chip: #1e293b;
      --bg-sidebar: #0a0f1a;
      --bg-sidebar-hover: #1a2332;
      --text-primary: #eef2f6;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --text-sidebar: #94a3b8;
      --text-sidebar-active: #ffffff;
      --border-color: #273340;
      --border-light: #2a364a;
      --shadow-color: rgba(0,0,0,0.3);
      --card-shadow: 0 8px 32px rgba(0,0,0,0.3);
      --input-focus: #3b82f6;
      --scrollbar-track: #1a1f29;
      --scrollbar-thumb: #3b82f6;
      --map-bg: #0b1119;
      --leaflet-zoom-bg: #1e293b;
      --leaflet-zoom-hover: #2d3a4f;
      --leaflet-zoom-color: #e2e8f0;
    }

    /* ========== RESET & LAYOUT ========== */
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,sans-serif; }
    body { background:var(--bg-primary); color:var(--text-primary); transition:background 0.3s,color 0.3s; }
    #trip-app { display:flex; min-height:100vh; }

    /* ========== SIDEBAR ========== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      color: var(--text-sidebar);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      flex-shrink: 0;
      border-right: 1px solid var(--border-color);
      transition: width 0.3s, transform 0.3s;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 100;
    }
    .sidebar .logo {
      padding: 0 20px 30px 20px;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sidebar .logo i { color: var(--primary); }
    .sidebar .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      color: var(--text-sidebar);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      border-left: 3px solid transparent;
    }
    .sidebar .nav-item:hover { background: var(--bg-sidebar-hover); color: #fff; }
    .sidebar .nav-item.active {
      background: var(--bg-sidebar-hover);
      color: var(--text-sidebar-active);
      border-left-color: var(--primary);
    }
    .sidebar .nav-item i { width: 20px; font-size: 16px; }
    .sidebar .nav-item .badge { margin-left: auto; background: var(--primary); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 20px; }

    .menu-toggle {
      display: none;
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 200;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-primary);
    }
    .menu-toggle:hover { background: var(--bg-hover); }

    /* ========== MAIN CONTENT ========== */
    .main-content {
      flex: 1;
      padding: 20px 30px;
      overflow-y: auto;
      min-height: 100vh;
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .app-header h1 { font-size: 22px; font-weight: 700; color: var(--text-primary); }
    .app-header h1 i { color: var(--primary); margin-right: 10px; }
    .header-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .badge { background:var(--bg-chip); padding:4px 16px; border-radius:30px; font-size:13px; color:var(--text-muted); border:1px solid var(--border-color); }
    .theme-toggle { background:var(--bg-input); border:1px solid var(--border-color); border-radius:30px; padding:6px 14px; color:var(--text-primary); cursor:pointer; font-size:16px; transition:0.2s; }
    .theme-toggle:hover { background:var(--bg-hover); }

    /* ========== SLIDING TABS ========== */
    .sliding-tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 6px;
      background: var(--bg-secondary);
      padding: 8px 12px;
      border-radius: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .sliding-tabs::-webkit-scrollbar { height: 4px; }
    .sliding-tabs::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }
    .sliding-tabs button {
      flex: 0 0 auto;
      background: transparent;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sliding-tabs button i { font-size: 14px; }
    .sliding-tabs button:hover { background: var(--bg-hover); color: var(--text-primary); }
    .sliding-tabs button.active { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }

    /* ========== CARDS ========== */
    .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:20px; padding:24px; margin-bottom:24px; box-shadow:var(--card-shadow); transition:background 0.3s,border 0.3s; }
    .card h3 { font-size:16px; font-weight:600; margin-bottom:20px; color:var(--text-secondary); }
    .card h3 i { margin-right:10px; color:var(--primary); }

    .input-group { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:12px; }
    .input-group input,.input-group select,.input-group textarea { background:var(--bg-input); border:1px solid var(--border-color); border-radius:12px; padding:10px 16px; color:var(--text-primary); font-size:14px; flex:1; min-width:150px; transition:0.2s; outline:none; }
    .input-group input:focus,.input-group select:focus,.input-group textarea:focus { border-color:var(--input-focus); box-shadow:0 0 0 3px rgba(59,130,246,0.2); }
    .input-group input::placeholder { color:var(--text-muted); }
    .input-group button { background:var(--primary); border:none; padding:10px 24px; border-radius:30px; font-weight:600; color:#fff; cursor:pointer; transition:0.2s; font-size:14px; white-space:nowrap; display:flex; align-items:center; gap:8px; }
    .input-group button:hover { background:var(--primary-hover); transform:scale(1.02); }
    .btn-danger { background:var(--danger)!important; }
    .btn-danger:hover { background:#dc2626!important; }
    .btn-success { background:var(--success)!important; }
    .btn-success:hover { background:#059669!important; }
    .btn-purple { background:var(--purple)!important; }
    .btn-purple:hover { background:#7c3aed!important; }

    .chip-group { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
    .chip { background:var(--bg-chip); padding:5px 14px; border-radius:30px; font-size:13px; display:flex; align-items:center; gap:8px; border:1px solid var(--border-color); color:var(--text-primary); }
    .chip .remove-chip { cursor:pointer; color:var(--text-muted); font-size:12px; }
    .chip .remove-chip:hover { color:var(--danger); }

    /* ========== MAP ========== */
    #map { height:400px; width:100%; border-radius:16px; border:1px solid var(--border-color); background:var(--map-bg); z-index:1; }
    .leaflet-routing-container { display:none!important; }
    .leaflet-control-zoom a { background:var(--leaflet-zoom-bg)!important; color:var(--leaflet-zoom-color)!important; border-color:var(--border-color)!important; }
    .leaflet-control-zoom a:hover { background:var(--leaflet-zoom-hover)!important; }

    #navInstructions { background:var(--bg-secondary); padding:16px 20px; border-radius:12px; border:1px solid var(--border-color); margin-top:12px; color:var(--text-primary); max-height:200px; overflow-y:auto; line-height:1.6; min-height:60px; }
    #navInstructions .placeholder { color:var(--text-muted); text-align:center; display:block; }

    .list-item { background:var(--bg-secondary); border-radius:12px; padding:14px 18px; border-left:4px solid var(--primary); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
    .list-item .info { flex:1; }
    .list-item .info .title { font-weight:600; }
    .list-item .info .sub { font-size:13px; color:var(--text-muted); }
    .list-item .amount { font-weight:700; color:var(--warning); }
    .receipt-thumb { max-width:80px; max-height:80px; border-radius:8px; border:1px solid var(--border-color); cursor:pointer; object-fit:cover; }

    .settlement-item { background:var(--bg-secondary); border-radius:12px; padding:16px 20px; border:1px solid var(--border-color); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
    .settlement-item .from { color:var(--danger); font-weight:700; }
    .settlement-item .to { color:var(--success); font-weight:700; }
    .settlement-item .s-amount { color:var(--warning); font-weight:700; font-size:18px; }

    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    .stat-box { background:var(--bg-secondary); padding:16px; border-radius:14px; border:1px solid var(--border-color); text-align:center; }
    .stat-box .label { color:var(--text-muted); font-size:13px; }
    .stat-box .value { font-size:26px; font-weight:700; color:var(--text-primary); margin-top:4px; }
    .stat-box .green { color:var(--success); }
    .stat-box .red { color:var(--danger); }
    .stat-box .blue { color:var(--primary); }
    .stat-box .warning { color:var(--warning); }

    .progress-container { background:var(--bg-secondary); border-radius:30px; height:20px; overflow:hidden; border:1px solid var(--border-color); margin:8px 0; }
    .progress-bar { height:100%; background:linear-gradient(90deg,var(--success),var(--warning),var(--danger)); transition:width 0.5s ease; border-radius:30px; }
    .progress-text { text-align:center; font-size:14px; font-weight:600; margin-top:4px; color:var(--text-muted); }

    #expenseChart { max-height:250px; max-width:100%; }

    .chat-container { max-height:300px; overflow-y:auto; padding:12px; background:var(--bg-input); border-radius:12px; border:1px solid var(--border-color); margin-bottom:12px; }
    .chat-msg { padding:8px 14px; border-radius:16px; margin-bottom:8px; max-width:80%; word-wrap:break-word; }
    .chat-msg.me { background:var(--primary); color:#fff; margin-left:auto; }
    .chat-msg.other { background:var(--bg-secondary); border:1px solid var(--border-color); }
    .chat-msg .sender { font-size:12px; font-weight:600; color:var(--text-muted); }
    .chat-msg .time { font-size:10px; color:var(--text-muted); margin-left:8px; }

    .packing-section { margin-bottom:16px; }
    .packing-section h4 { font-size:14px; font-weight:600; color:var(--text-secondary); margin-bottom:8px; }
    .packing-item { display:flex; align-items:center; gap:12px; padding:6px 12px; background:var(--bg-secondary); border-radius:8px; margin-bottom:4px; border:1px solid var(--border-color); }
    .packing-item input[type="checkbox"] { width:18px; height:18px; accent-color:var(--primary); cursor:pointer; }
    .packing-item .item-text { flex:1; font-size:14px; }
    .packing-item .item-text.done { text-decoration:line-through; color:var(--text-muted); }
    .packing-item .item-category { font-size:11px; padding:2px 10px; border-radius:20px; background:var(--bg-chip); color:var(--text-muted); }

    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:99999; justify-content:center; align-items:center; animation:fadeIn 0.3s ease; }
    .modal-overlay.active { display:flex; }
    .modal-box { background:var(--bg-card); border:1px solid var(--border-color); border-radius:24px; padding:30px; max-width:500px; width:90%; color:var(--text-primary); box-shadow:0 20px 60px rgba(0,0,0,0.8); max-height:90vh; overflow-y:auto; }
    .modal-box h2 { font-size:20px; margin-bottom:16px; }
    .modal-box h2 i { color:var(--primary); margin-right:10px; }
    .modal-box .btn-group { display:flex; gap:12px; margin-top:16px; }
    .modal-box .btn-group button { flex:1; padding:12px; border:none; border-radius:30px; font-weight:600; cursor:pointer; }
    .modal-box .btn-group .cancel-btn { background:var(--bg-chip); color:var(--text-primary); }
    .modal-box .btn-group .cancel-btn:hover { background:var(--bg-hover); }
    .modal-box .btn-group .save-btn { background:var(--primary); color:#fff; }
    .modal-box .btn-group .save-btn:hover { background:var(--primary-hover); }

    /* ========== AUTH CARD ========== */
    .auth-card { background:var(--bg-card); border:2px solid var(--primary); border-radius:20px; padding:24px; margin-bottom:24px; text-align:center; }
    .auth-card h2 { font-size:22px; margin-bottom:8px; color:var(--text-primary); }
    .auth-card h2 i { color:var(--primary); margin-right:10px; }
    .auth-card p { color:var(--text-muted); margin-bottom:20px; }
    .auth-card .input-group { justify-content:center; }
    .auth-card .input-group input { max-width:200px; text-align:center; font-size:24px; letter-spacing:8px; padding:12px; }
    .auth-card .btn-group { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:12px; }
    .auth-card .btn-group button { padding:12px 28px; border:none; border-radius:30px; font-weight:600; font-size:15px; cursor:pointer; transition:0.2s; color:#fff; min-width:120px; }
    .auth-card .btn-group .primary-btn { background:var(--primary); }
    .auth-card .btn-group .primary-btn:hover { background:var(--primary-hover); }
    .auth-card .btn-group .secondary-btn { background:var(--success); }
    .auth-card .btn-group .secondary-btn:hover { background:#059669; }
    .auth-card .error-msg { color:var(--danger); font-size:14px; margin-top:12px; min-height:20px; }

    .sync-status { color:var(--text-muted); font-size:13px; margin-top:6px; }
    .sync-status.success { color:var(--success); }
    .sync-status.error { color:var(--danger); }

    .page { display:none; animation:fadeIn 0.3s ease; }
    .page.active { display:block; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

    .weather-cards { display:flex; gap:12px; overflow-x:auto; padding:8px 0; }
    .weather-card { background:var(--bg-secondary); padding:16px; border-radius:12px; border:1px solid var(--border-color); min-width:120px; text-align:center; flex-shrink:0; }
    .weather-card .day { font-weight:600; font-size:14px; }
    .weather-card .temp { font-size:20px; font-weight:700; }
    .weather-card .desc { font-size:12px; color:var(--text-muted); }
    .weather-card .icon { font-size:32px; }

    .notif-banner { background:var(--bg-secondary); border:1px solid var(--border-color); border-radius:12px; padding:12px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .notif-banner .status { font-size:13px; color:var(--text-muted); }
    .notif-banner .status.enabled { color:var(--success); }
    .notif-banner .status.disabled { color:var(--danger); }

    /* ========== TOAST NOTIFICATION ========== */
    .toast-message {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--bg-card);
      color: var(--text-primary);
      padding: 12px 28px;
      border-radius: 30px;
      box-shadow: 0 8px 32px var(--shadow-color);
      border: 1px solid var(--border-color);
      z-index: 99999;
      font-weight: 500;
      font-size: 15px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast-message.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); width: 260px; height: 100vh; transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .menu-toggle { display: block; }
      .main-content { padding: 16px; margin-top: 60px; }
      .grid-2 { grid-template-columns: 1fr; }
      .app-header { flex-direction: column; align-items: stretch; text-align: center; }
      .header-actions { justify-content: center; }
      .input-group { flex-direction: column; align-items: stretch; }
      .toast-message { white-space: normal; max-width: 90%; }
    }

    @media (min-width: 769px) {
      .menu-toggle { display: none; }
      .sidebar { transform: translateX(0) !important; }
    }
  </style>
</head>
<body>

<div id="trip-app">
  <!-- Menu Toggle (Mobile) -->
  <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="logo"><i class="fas fa-plane-departure"></i> Trip Planner</div>
    <div class="nav-item active" data-page="dashboard"><i class="fas fa-home"></i> Dashboard</div>
    <div class="nav-item" data-page="itinerary"><i class="fas fa-map-marked-alt"></i> Itinerary</div>
    <div class="nav-item" data-page="expenses"><i class="fas fa-wallet"></i> Expenses</div>
    <div class="nav-item" data-page="settlements"><i class="fas fa-hand-holding-usd"></i> Settle</div>
    <div class="nav-item" data-page="weather"><i class="fas fa-cloud-sun"></i> Weather</div>
    <div class="nav-item" data-page="chart"><i class="fas fa-chart-pie"></i> Chart</div>
    <div class="nav-item" data-page="chat"><i class="fas fa-comments"></i> Chat</div>
    <div class="nav-item" data-page="packing"><i class="fas fa-suitcase"></i> Packing</div>
    <div style="flex:1;"></div>
    <div style="padding:20px;">
      <button id="themeToggleBtn" class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- Header -->
    <div class="app-header">
      <h1><i class="fas fa-plane-departure"></i> Trip Planner</h1>
      <div class="header-actions">
        <div class="badge" id="tripStatus">📅 No trip</div>
      </div>
    </div>

    <!-- Notification Banner -->
    <div class="notif-banner">
      <i class="fas fa-bell"></i>
      <span>Notifications: </span>
      <span id="notifStatus" class="status">Checking...</span>
      <button onclick="requestNotificationPermission()" style="background:var(--primary);border:none;padding:4px 16px;border-radius:20px;color:#fff;cursor:pointer;font-size:12px;font-weight:600;">Enable</button>
    </div>

    <!-- Sliding Tabs -->
    <div class="sliding-tabs" id="slidingTabs">
      <button class="active" data-page="dashboard"><i class="fas fa-home"></i> Dash</button>

<script>
  // ============================================================
  // 1. FIREBASE CONFIG & INIT
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyDHFcRRJo_OzuPla9TTLQKTqP0psyrVU1Y",
    authDomain: "trip-planner-cacaf.firebaseapp.com",
    databaseURL: "https://trip-planner-cacaf-default-rtdb.firebaseio.com",
    projectId: "trip-planner-cacaf",
    storageBucket: "trip-planner-cacaf.firebasestorage.app",
    messagingSenderId: "829860320918",
    appId: "1:829860320918:web:4062460a825314a49414b7",
    measurementId: "G-0MX66HVEK7"
  };
  firebase.initializeApp(firebaseConfig);
  const database = firebase.database();

  let currentTripPin = null, isSyncing = false, isLocalUpdate = false;
  let mapInstance = null, mapMarkers = [], routingControl = null, userMarker = null, tempMarker = null;
  let watchId = null, isNavigating = false, editExpenseIdx = null, chartInstance = null, currentTheme = 'light';
  let lastNotificationData = null;

  let appData = {
    tripName: 'New Trip', tripDate: new Date().toISOString().split('T')[0],
    participants: [], itinerary: [], expenses: [], packing: { personal: [], common: [], electronics: [] },
    chatMessages: [], budget: 0, createdAt: Date.now()
  };

  // ============================================================
  // 2. TOAST NOTIFICATION
  // ============================================================
  function showToast(message) {
    // Remove existing toast if any
    const existing = document.querySelector('.toast-message');
    if (existing) existing.remove();

    const toast = document.createElement('div');
    toast.className = 'toast-message';
    toast.textContent = message;
    document.body.appendChild(toast);

    // Trigger show after a tiny delay for the transition
    setTimeout(() => {
      toast.classList.add('show');
    }, 10);

    // Auto hide after 2.5 seconds
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => {
        if (toast.parentNode) toast.remove();
      }, 400);
    }, 2500);
  }

  // ============================================================
  // 3. NOTIFICATION SYSTEM
  // ============================================================
  function requestNotificationPermission() {
    if (!('Notification' in window)) { updateNotifStatus(false, 'Not supported'); return; }
    if (Notification.permission === 'granted') { updateNotifStatus(true, 'Enabled ✅'); return; }
    if (Notification.permission === 'denied') { updateNotifStatus(false, 'Blocked ❌'); return; }
    Notification.requestPermission().then(p => {
      if (p === 'granted') { updateNotifStatus(true, 'Enabled ✅'); showNotification('🔔 Notifications Enabled', 'You will get real-time trip updates.'); }
      else updateNotifStatus(false, 'Denied ❌');
    });
  }

  function updateNotifStatus(enabled, msg) {
    const el = document.getElementById('notifStatus');
    if (!el) return;
    el.textContent = msg;
    el.className = 'status ' + (enabled ? 'enabled' : 'disabled');
  }

  function showNotification(title, body, tag = null) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    if (tag && lastNotificationData === tag) return;
    lastNotificationData = tag;
    new Notification(title, {
      body: body || '',
      icon: 'https://raw.githubusercontent.com/binukallara/trip-planner/refs/heads/main/icon-192.png',
      vibrate: [200, 100, 200],
      tag: tag || 'trip-notification',
      requireInteraction: true,
      data: { url: window.location.href }
    }).onclick = function() { window.focus(); this.close(); };
  }

  // ============================================================
  // 4. HELPERS & SYNC
  // ============================================================
  function generateId() { return Date.now() + Math.random().toString(36); }
  function updateSyncStatus(msg, err = false) {
    const el = document.getElementById('syncStatus');
    if (!el) return;
    el.textContent = msg;
    el.className = 'sync-status ' + (err ? 'error' : 'success');
  }

  function syncToFirebase() {
    if (!currentTripPin) { updateSyncStatus('❌ No PIN', true); return; }
    isLocalUpdate = true;
    database.ref('trips/' + currentTripPin).set(appData)
      .then(() => { isLocalUpdate = false; updateSyncStatus('✅ Synced'); setTimeout(() => { const el = document.getElementById('syncStatus'); if (el) el.textContent = 'Real-time sync enabled 🔄'; }, 2000); })
      .catch(err => { isLocalUpdate = false; console.error('Sync error:', err); updateSyncStatus('❌ Sync failed: ' + err.message, true); });
  }

  // ============================================================
  // 5. REAL-TIME LISTENER
  // ============================================================
  function startRealtimeListener(pin) {
    if (isSyncing) return;
    isSyncing = true;
    database.ref('trips/' + pin).on('value', (snapshot) => {
      if (!snapshot.exists()) { localStorage.removeItem('tripPin'); localStorage.removeItem('tripData'); alert('Trip deleted.'); window.location.reload(); return; }
      const remoteData = snapshot.val();
      if (isLocalUpdate) { isLocalUpdate = false; return; }
      const oldData = appData;
      const newData = {
        ...remoteData,
        participants: remoteData.participants || [],
        itinerary: remoteData.itinerary || [],
        expenses: remoteData.expenses || [],
        packing: remoteData.packing || { personal: [], common: [], electronics: [] },
        chatMessages: remoteData.chatMessages || [],
        budget: remoteData.budget || 0
      };
      if (oldData.expenses && newData.expenses && newData.expenses.length > oldData.expenses.length) {
        const newExp = newData.expenses[newData.expenses.length - 1];
        showNotification('💰 New Expense', `${newExp.desc}: ₹${newExp.amount.toFixed(2)} paid by ${newExp.paidBy}`, 'expense-' + newExp.id);
      }
      if (oldData.chatMessages && newData.chatMessages && newData.chatMessages.length > oldData.chatMessages.length) {
        const newMsg = newData.chatMessages[newData.chatMessages.length - 1];
        if (newMsg.sender !== localStorage.getItem('chatUser') && newMsg.sender !== 'You') {
          showNotification('💬 New Message', `${newMsg.sender}: ${newMsg.text}`, 'chat-' + newMsg.timestamp);
        }
      }
      if (oldData.itinerary && newData.itinerary && newData.itinerary.length > oldData.itinerary.length) {
        const newPlace = newData.itinerary[newData.itinerary.length - 1];
        showNotification('📍 New Place', `Added: ${newPlace.name}`, 'place-' + newPlace.id);
      }
      if (oldData.tripName !== newData.tripName || oldData.tripDate !== newData.tripDate) {
        showNotification('✈️ Trip Updated', `${newData.tripName} - ${newData.tripDate}`, 'trip-update');
      }
      appData = newData;
      localStorage.setItem('tripData', JSON.stringify(appData));
      updateUI();
    }, (error) => console.error('Listener error:', error));
  }

  // ============================================================
  // 6. GRANULAR UI UPDATE
  // ============================================================
  function updateUI() {
    updateParticipants();
    updateItinerary();
    updateExpenses();
    updateStats();
    updateBudgetUI();
    updateChat();
    updatePacking();
    updateChart();
    document.getElementById('tripStatus').innerHTML = `📅 ${appData.tripDate} | ${appData.tripName}`;
    if (mapInstance) updateMapMarkers();
  }

  // ============================================================
  // 7. THEME
  // ============================================================
  function toggleTheme() {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    localStorage.setItem('theme', currentTheme);
    const btn = document.getElementById('themeToggleBtn');
    if (btn) btn.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  }
  function loadTheme() {
    const saved = localStorage.getItem('theme');
    if (saved) currentTheme = saved;
    else { currentTheme = 'light'; localStorage.setItem('theme', 'light'); }
    document.documentElement.setAttribute('data-theme', currentTheme);
    const btn = document.getElementById('themeToggleBtn');
    if (btn) btn.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
  }

  // ============================================================
  // 8. AUTH (Integrated into Dashboard)
  // ============================================================
  function showAuthCard() {
    const page = document.getElementById('page-dashboard');
    if (!page) return;
    page.innerHTML = `

        <h2><i class="fas fa-plane-departure"></i> Join or Create a Trip</h2>
        <p>Enter a 4-digit PIN to join an existing trip, or create a new one.</p>
        <div class="input-group">
          <input type="text" id="pinInput" maxlength="4" placeholder="Enter PIN" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div id="authError" class="error-msg"></div>
        <div class="btn-group">
          <button class="secondary-btn" id="joinTripBtn"><i class="fas fa-sign-in-alt"></i> Join Trip</button>
          <button class="primary-btn" id="newTripBtn"><i class="fas fa-plus"></i> New Trip</button>
        </div>
      </div>
      <div class="card"><h3><i class="fas fa-info-circle"></i> Quick Start</h3><p style="color:var(--text-muted);">Create a new trip or join an existing one to start planning.</p></div>
    `;
    document.getElementById('joinTripBtn').addEventListener('click', joinTrip);
    document.getElementById('newTripBtn').addEventListener('click', createNewTrip);
    document.getElementById('pinInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('joinTripBtn').click(); });
  }

  function setAuthError(msg) { const el = document.getElementById('authError'); if (el) el.textContent = msg; }
  function clearAuthError() { const el = document.getElementById('authError'); if (el) el.textContent = ''; }

  function generatePin() { return String(Math.floor(1000 + Math.random() * 9000)); }

  function createNewTrip() {
    clearAuthError();
    const pin = generatePin();
    const newTripData = { tripName: 'My Trip', tripDate: new Date().toISOString().split('T')[0], participants: [], itinerary: [], expenses: [], packing: { personal: [], common: [], electronics: [] }, chatMessages: [], budget: 0, createdAt: firebase.database.ServerValue.TIMESTAMP };
    database.ref('trips/' + pin).set(newTripData)
      .then(() => { currentTripPin = pin; appData = newTripData; localStorage.setItem('tripData', JSON.stringify(appData)); localStorage.setItem('tripPin', pin); buildDashboard(); startRealtimeListener(pin); setTimeout(() => showShareModal(pin), 500); })
      .catch(err => { console.error(err); setAuthError('Error: ' + err.message); });
  }

  function joinTrip() {
    clearAuthError();
    const pin = document.getElementById('pinInput').value.trim();
    if (!pin || pin.length !== 4 || isNaN(pin)) { setAuthError('Enter a valid 4-digit PIN.'); return; }
    database.ref('trips/' + pin).once('value')
      .then(snapshot => {
        if (!snapshot.exists()) { setAuthError('Trip not found.'); return; }
        const data = snapshot.val();
        data.participants = data.participants || [];
        data.itinerary = data.itinerary || [];
        data.expenses = data.expenses || [];
        data.packing = data.packing || { personal: [], common: [], electronics: [] };
        data.chatMessages = data.chatMessages || [];
        data.budget = data.budget || 0;
        currentTripPin = pin;
        appData = data;
        localStorage.setItem('tripData', JSON.stringify(appData));
        localStorage.setItem('tripPin', pin);
        buildDashboard();
        startRealtimeListener(pin);
      })
      .catch(err => { console.error(err); setAuthError('Error: ' + err.message); });
  }

          <button onclick="shareViaSMS('${pin}')" style="padding:10px 20px;border:none;border-radius:30px;font-weight:600;color:#fff;background:#34B7F1;cursor:pointer;"><i class="fas fa-sms"></i> SMS</button>

        </div>

  function shareViaWhatsApp(pin) { const url = window.location.href; const msg = encodeURIComponent(`✈️ Trip Planner\nJoin my trip with PIN: ${pin}\nLink: ${url}`); window.open(`https://wa.me/?text=${msg}`,'_blank'); }

  // ============================================================
  // 9. RENDER FUNCTIONS (Page Builders)

  function buildDashboard() {

  function initMap() {
    if (mapInstance) { mapInstance.remove(); mapInstance = null; }
    const defaultLoc = [10.089, 77.059];
    if (typeof L === 'undefined') { document.getElementById('map').innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger);">⚠️ Leaflet not loaded.</div>'; return; }
    mapInstance = L.map('map', { center: defaultLoc, zoom: 10, zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(mapInstance);
    L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
    mapInstance.on('click', function(e) {
      document.getElementById('placeLat').value = e.latlng.lat.toFixed(6);
      document.getElementById('placeLng').value = e.latlng.lng.toFixed(6);
      if (tempMarker) mapInstance.removeLayer(tempMarker);
      tempMarker = L.marker(e.latlng, { draggable: true }).addTo(mapInstance).bindPopup(`Lat: ${e.latlng.lat.toFixed(6)}<br>Lng: ${e.latlng.lng.toFixed(6)}`).openPopup();
      tempMarker.on('dragend', function() { const pos = tempMarker.getLatLng(); document.getElementById('placeLat').value = pos.lat.toFixed(6); document.getElementById('placeLng').value = pos.lng.toFixed(6); });
    });
    updateMapMarkers();
  }

  function updateMapMarkers() {
    if (!mapInstance) return;
    mapMarkers.forEach(m => { if (mapInstance.hasLayer(m)) mapInstance.removeLayer(m); });
    mapMarkers = [];
    if (routingControl) { mapInstance.removeControl(routingControl); routingControl = null; }
    const data = appData.itinerary || [];
    if (data.length === 0) {
      mapInstance.setView([10.089, 77.059], 10);
      document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Add places to see route.</span>';
      return;
    }
    const waypoints = [], latlngs = [];
    data.forEach(item => {
      const lat = parseFloat(item.lat), lng = parseFloat(item.lng);
      if (isNaN(lat) || isNaN(lng)) return;
      const pos = [lat, lng];
      latlngs.push(pos);
      waypoints.push(L.latLng(lat, lng));
      const marker = L.marker(pos, { title: item.name }).bindPopup(`<b>${item.name}</b><br>${item.desc || ''}`).addTo(mapInstance);
      mapMarkers.push(marker);
    });
    if (latlngs.length === 1) mapInstance.setView(latlngs[0], 12);
    else if (latlngs.length > 1) {
      try {
        routingControl = L.Routing.control({
          waypoints: waypoints,
          routeWhileDragging: false,
          showAlternatives: false,
          fitSelectedRoutes: true,
          addWaypoints: false,
          draggableWaypoints: false,
          show: false,
          createMarker: function() { return null; },
          lineOptions: { styles: [{ color: '#3b82f6', weight: 4, opacity: 0.8 }] },
          router: L.Routing.openRouteService({
            apiKey: 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjgxNWQ4MTc3NWI1MDQ0NDg4ZWQ3NDVlZDk3MDJmZDc4IiwiaCI6Im11cm11cjY0In0=',
            profile: 'driving-car'
          })
        }).addTo(mapInstance);

        routingControl.on('routesfound', function(e) {
          const routes = e.routes;
          if (!routes || routes.length === 0) { document.getElementById('navInstructions').innerHTML = '<span class="placeholder">No route found.</span>'; return; }
          const route = routes[0];
          let instructions = [];
          if (route.legs && route.legs.length > 0) route.legs.forEach(leg => { if (leg.steps) instructions = instructions.concat(leg.steps); });
          else if (route.steps) instructions = route.steps;
          let html = '';
          instructions.forEach((step, idx) => {
            let text = step.instruction || step.text || step.name || '';
            let dist = step.distance || 0;
            let distStr = dist > 0 ? (dist >= 1000 ? (dist/1000).toFixed(1) + ' km' : Math.round(dist) + ' m') : '';
            html += `<div class="instruction-step"><span class="step-number">${idx+1}.</span><span class="step-text">${text}</span>${distStr ? `<span class="step-distance">${distStr}</span>` : ''}</div>`;
          });
          document.getElementById('navInstructions').innerHTML = html || '<span class="placeholder">No instructions available.</span>';
        });
        routingControl.on('routingerror', function(e) {
          document.getElementById('navInstructions').innerHTML = '<span style="color:var(--danger);">❌ Could not calculate route. Check API key or network.</span>';
        });
        setTimeout(() => { if (routingControl) routingControl.route(); }, 500);
      } catch (e) {
        console.error('Routing error:', e);
        const polyline = L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.8 }).addTo(mapInstance);
        const bounds = L.latLngBounds(latlngs);
        mapInstance.fitBounds(bounds, { padding: [30, 30] });
      }
    }
    if (userMarker && !mapInstance.hasLayer(userMarker)) userMarker.addTo(mapInstance);
  }

  function startLiveTracking() {
    if (!navigator.geolocation) { document.getElementById('locationStatus').innerHTML = '❌ GPS not supported.'; return; }
    if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    document.getElementById('locationStatus').innerHTML = '📍 GPS Active...';
    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        document.getElementById('locationStatus').innerHTML = `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
        if (mapInstance) {
          if (userMarker) { userMarker.setLatLng([lat, lng]); } else {
            const icon = L.divIcon({ className: 'fa-solid fa-location-dot', iconSize: [24, 24], html: '<i class="fas fa-location-dot" style="color:#3b82f6;font-size:28px;text-shadow:0 0 10px rgba(59,130,246,0.5);"></i>' });
            userMarker = L.marker([lat, lng], { icon: icon, title: 'You are here' }).addTo(mapInstance).bindPopup('📍 You are here!');
          }
          if (isNavigating) mapInstance.flyTo([lat, lng], 15, { duration: 1 });
        }
      },
      (err) => { document.getElementById('locationStatus').innerHTML = `❌ GPS Error: ${err.message}`; watchId = null; },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 }
    );
  }

  function toggleNavigation() {
    if (isNavigating) {
      isNavigating = false;
      if (watchId) { navigator.geolocation.clearWatch(watchId); watchId = null; document.getElementById('locationStatus').innerHTML = '⏹️ GPS stopped.'; }
      document.getElementById('navToggleBtn').innerHTML = '<i class="fas fa-play"></i> Start Navigation';
      document.getElementById('navToggleBtn').className = 'btn-success';
      document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Navigation stopped.</span>';
      return;
    }
    if ((appData.itinerary || []).length < 2) { alert('Add at least 2 places for navigation.'); return; }
    isNavigating = true;
    document.getElementById('navToggleBtn').innerHTML = '<i class="fas fa-stop"></i> Stop Navigation';
    document.getElementById('navToggleBtn').className = 'btn-danger';
    if (!watchId) startLiveTracking();
    else if (userMarker) { const latlng = userMarker.getLatLng(); mapInstance.flyTo(latlng, 15, { duration: 1 }); }
    if (routingControl) routingControl.route();
  }

  function searchPlace() {
    const query = document.getElementById('placeName').value.trim();
    if (!query) { alert('Enter a place name.'); return; }
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
    document.getElementById('searchStatus').innerHTML = '🔍 Searching...';
    fetch(url).then(res => res.json()).then(data => {
      if (data && data.length > 0) {
        const result = data[0];
        document.getElementById('placeName').value = result.display_name || query;
        document.getElementById('placeLat').value = parseFloat(result.lat).toFixed(6);
        document.getElementById('placeLng').value = parseFloat(result.lon).toFixed(6);
        document.getElementById('searchStatus').innerHTML = '✅ Found!';
        if (mapInstance) {
          if (tempMarker) mapInstance.removeLayer(tempMarker);
          tempMarker = L.marker([result.lat, result.lon], { draggable: true }).addTo(mapInstance).bindPopup(`Lat: ${parseFloat(result.lat).toFixed(6)}<br>Lng: ${parseFloat(result.lon).toFixed(6)}`).openPopup();
          mapInstance.setView([result.lat, result.lon], 13);
          tempMarker.on('dragend', function() { const pos = tempMarker.getLatLng(); document.getElementById('placeLat').value = pos.lat.toFixed(6); document.getElementById('placeLng').value = pos.lng.toFixed(6); });
        }
      } else { document.getElementById('searchStatus').innerHTML = '❌ Not found. Try manual.'; }
    }).catch(() => { document.getElementById('searchStatus').innerHTML = '❌ Search failed.'; });
  }

  // ============================================================
  // 13. SETTLEMENT
  // ============================================================
  function calculateSettlements() {
    const container = document.getElementById('settlementTransactions');
    const summary = document.getElementById('settlementSummary');
    const participants = appData.participants || [];
    const expenses = appData.expenses || [];
    if (participants.length === 0) { container.innerHTML = '<div style="color:var(--danger);">Add participants first!</div>'; return; }
    if (expenses.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);">No expenses.</div>'; return; }
    const totalPaid = {};
    participants.forEach(p => totalPaid[p] = 0);
    expenses.forEach(exp => { const amt = parseFloat(exp.amount); if (totalPaid[exp.paidBy] !== undefined) totalPaid[exp.paidBy] += amt; });
    const totalCost = expenses.reduce((s, e) => s + parseFloat(e.amount), 0);
    const share = participants.length > 0 ? totalCost / participants.length : 0;
    const netBalance = {};
    participants.forEach(p => { netBalance[p] = totalPaid[p] - share; });
    summary.innerHTML = `<div class="stat-box"><div class="label">Total Cost</div><div class="value blue">₹${totalCost.toFixed(2)}</div></div><div class="stat-box"><div class="label">Per Person Share</div><div class="value">₹${share.toFixed(2)}</div></div>${participants.map(p => `<div class="stat-box"><div class="label">${p} (Paid ₹${totalPaid[p].toFixed(2)})</div><div class="value ${netBalance[p] >= 0 ? 'green' : 'red'}">${netBalance[p] >= 0 ? '+' : ''}${netBalance[p].toFixed(2)}</div></div>`).join('')}`;
    let payers = participants.filter(p => netBalance[p] < 0).map(p => ({ name: p, amount: -netBalance[p] }));
    let receivers = participants.filter(p => netBalance[p] > 0).map(p => ({ name: p, amount: netBalance[p] }));
    let transactions = [];
    let i = 0, j = 0;
    while (i < payers.length && j < receivers.length) {
      let payer = payers[i], receiver = receivers[j];
      let settleAmt = Math.min(payer.amount, receiver.amount);
      if (settleAmt > 0.01) { transactions.push({ from: payer.name, to: receiver.name, amount: settleAmt }); }
      payer.amount -= settleAmt; receiver.amount -= settleAmt;
      if (payer.amount < 0.01) i++;
      if (receiver.amount < 0.01) j++;
    }
    container.innerHTML = transactions.length === 0 ? '<div style="color:var(--success);font-weight:600;">✅ All settled!</div>' : transactions.map(t => `<div class="settlement-item"><div><span class="from">${t.from}</span> <i class="fas fa-arrow-right" style="color:var(--text-muted);margin:0 12px;"></i> <span class="to">${t.to}</span></div><div class="s-amount">₹${t.amount.toFixed(2)}</div></div>`).join('');
  }

  // ============================================================
  // 14. PDF EXPORT
  // ============================================================
  function exportPDF() {
    const participants = appData.participants || [];
    const expenses = appData.expenses || [];
    if (participants.length === 0 || expenses.length === 0) { alert('Add participants and expenses first.'); return; }
    if (typeof html2canvas === 'undefined' || (typeof window.jspdf === 'undefined' && typeof window.jsPDF === 'undefined')) { alert('PDF libraries not loaded.'); return; }

    const totalPaid = {};
    participants.forEach(p => totalPaid[p] = 0);
    expenses.forEach(exp => { const amt = parseFloat(exp.amount); if (totalPaid[exp.paidBy] !== undefined) totalPaid[exp.paidBy] += amt; });
    const totalCost = expenses.reduce((s, e) => s + parseFloat(e.amount), 0);
    const share = participants.length > 0 ? totalCost / participants.length : 0;
    const netBalance = {};
    participants.forEach(p => { netBalance[p] = totalPaid[p] - share; });

    let payers = participants.filter(p => netBalance[p] < 0).map(p => ({ name: p, amount: -netBalance[p] }));
    let receivers = participants.filter(p => netBalance[p] > 0).map(p => ({ name: p, amount: netBalance[p] }));
    let transactions = [];
    let i = 0, j = 0;
    while (i < payers.length && j < receivers.length) {
      let payer = payers[i], receiver = receivers[j];
      let settleAmt = Math.min(payer.amount, receiver.amount);
      if (settleAmt > 0.01) { transactions.push({ from: payer.name, to: receiver.name, amount: settleAmt }); }
      payer.amount -= settleAmt; receiver.amount -= settleAmt;
      if (payer.amount < 0.01) i++;
      if (receiver.amount < 0.01) j++;
    }
    const currency = '₹';
    const rows = expenses.map((exp, idx) => `
      <tr><td style="padding:6px 10px;border:1px solid #d1d5db;text-align:center;">${idx+1}</td><td style="padding:6px 10px;border:1px solid #d1d5db;">${exp.desc}</td><td style="padding:6px 10px;border:1px solid #d1d5db;text-align:right;">${currency}${parseFloat(exp.amount).toFixed(2)}</td><td style="padding:6px 10px;border:1px solid #d1d5db;">${exp.paidBy}</td><td style="padding:6px 10px;border:1px solid #d1d5db;">${exp.category||'Other'}</td></tr>
    `).join('');
    const balanceRows = participants.map(p => {
      const bal = netBalance[p];
      return `<tr><td style="padding:6px 10px;border:1px solid #d1d5db;">${p}</td><td style="padding:6px 10px;border:1px solid #d1d5db;text-align:right;">${currency}${totalPaid[p].toFixed(2)}</td><td style="padding:6px 10px;border:1px solid #d1d5db;text-align:right;color:${bal>=0?'#16a34a':'#dc2626'};font-weight:600;">${bal>=0?'+':''}${currency}${bal.toFixed(2)}</td></tr>`;
    }).join('');
    const txnRows = transactions.map(t => `
      <tr><td style="padding:6px 10px;border:1px solid #d1d5db;">${t.from}</td><td style="padding:6px 10px;border:1px solid #d1d5db;">${t.to}</td><td style="padding:6px 10px;border:1px solid #d1d5db;text-align:right;">${currency}${t.amount.toFixed(2)}</td></tr>
    `).join('');

    const htmlContent = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Settlement Report</title><style>body{font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:30px;background:#fff;color:#1e293b;}.container{max-width:700px;margin:0 auto;}h1{text-align:center;font-size:22px;}.subtitle{text-align:center;color:#64748b;font-size:14px;margin-bottom:24px;}.section{margin:20px 0;}.section-title{font-size:16px;font-weight:600;border-bottom:2px solid #3b82f6;padding-bottom:4px;margin-bottom:10px;}table{width:100%;border-collapse:collapse;font-size:13px;}th{background:#f1f5f9;padding:6px 10px;border:1px solid #d1d5db;text-align:left;font-weight:600;}td{padding:6px 10px;border:1px solid #d1d5db;}.summary-box{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0;}.summary-item{background:#f8fafc;padding:10px 20px;border-radius:8px;text-align:center;border:1px solid #e2e8f0;flex:1;min-width:100px;}.summary-item .label{font-size:12px;color:#64748b;}.summary-item .value{font-size:20px;font-weight:700;color:#0f172a;}.participant-badge{display:inline-block;background:#e2e8f0;padding:2px 12px;border-radius:20px;font-size:13px;margin:2px;}.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:24px;border-top:1px solid #e2e8f0;padding-top:12px;}</style></head><body><div class="container"><h1>📊 Trip Settlement Report</h1><div class="subtitle">${appData.tripName} — ${appData.tripDate}</div><div class="section"><div class="section-title">👥 Participants</div><div style="display:flex;flex-wrap:wrap;gap:4px;">${participants.map(p => `<span class="participant-badge">${p}</span>`).join('')}</div></div><div class="section"><div class="section-title">💰 Shared Expenses</div><table><thead><tr><th style="width:40px;text-align:center;">#</th><th>Description</th><th style="text-align:right;">Amount</th><th>Paid By</th><th>Category</th></tr></thead><tbody>${rows || '<tr><td colspan="5" style="text-align:center;">No expenses recorded.</td></tr>'}</tbody></table></div><div class="section"><div class="section-title">📈 Summary</div><div class="summary-box"><div class="summary-item"><div class="label">Total Cost</div><div class="value">${currency}${totalCost.toFixed(2)}</div></div><div class="summary-item"><div class="label">Per Person Share</div><div class="value">${currency}${share.toFixed(2)}</div></div></div><table><thead><tr><th>Participant</th><th style="text-align:right;">Total Paid</th><th style="text-align:right;">Net Balance</th></tr></thead><tbody>${balanceRows}</tbody></table></div><div class="section"><div class="section-title">🔄 Settlement Transactions</div>${transactions.length > 0 ? `<table><thead><tr><th>From</th><th>To</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${txnRows}</tbody></table><div style="margin-top:6px;font-size:13px;color:#475569;">Total transactions: ${transactions.length}</div>` : `<p style="color:#16a34a;font-weight:600;">✅ All settled!</p>`}</div><div class="footer">This settlement was calculated by Trip Planner. All amounts are rounded to 2 decimal places.</div></div></body></html>`;

    const tempDiv = document.createElement('div');
    tempDiv.style.position = 'fixed';
    tempDiv.style.left = '-9999px';
    tempDiv.style.top = '0';
    tempDiv.style.width = '750px';
    tempDiv.style.background = '#ffffff';
    tempDiv.style.zIndex = '9999';
    tempDiv.style.padding = '20px';
    tempDiv.innerHTML = htmlContent;
    document.body.appendChild(tempDiv);

    html2canvas(tempDiv, { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, width: 750, height: tempDiv.scrollHeight })
      .then(canvas => {
        let jsPDFConstructor = null;
        if (window.jspdf && typeof window.jspdf.jsPDF === 'function') jsPDFConstructor = window.jspdf.jsPDF;
        else if (window.jsPDF && typeof window.jsPDF === 'function') jsPDFConstructor = window.jsPDF;
        else if (typeof jsPDF === 'function') jsPDFConstructor = jsPDF;
        if (!jsPDFConstructor) { document.body.removeChild(tempDiv); alert('jsPDF not found.'); return; }
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const doc = new jsPDFConstructor('p', 'mm', 'a4');
        const pdfWidth = 210;
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        doc.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        doc.save(`Settlement_${appData.tripName || 'Trip'}.pdf`);
        document.body.removeChild(tempDiv);
      })
      .catch(err => { console.error(err); document.body.removeChild(tempDiv); alert('PDF generation failed: ' + err.message); });
  }

  // ============================================================
  // 15. WEATHER
  // ============================================================
  function fetchWeather() {
    const container = document.getElementById('weatherContainer');
    if (!container) return;
    container.innerHTML = '<div style="color:var(--text-muted);">Loading weather...</div>';
    const places = appData.itinerary || [];
    if (places.length === 0) { container.innerHTML = '<div style="color:var(--text-muted);">Add places to see weather forecast.</div>'; return; }
    const place = places[0];
    const lat = parseFloat(place.lat), lng = parseFloat(place.lng);
    if (isNaN(lat) || isNaN(lng)) { container.innerHTML = '<div style="color:var(--text-muted);">Invalid coordinates.</div>'; return; }
    const apiKey = '57c483939791f79f7b18c8c801582ab4';
    const url = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lng}&units=metric&appid=${apiKey}`;
    fetch(url).then(res => res.json()).then(data => {
      if (data.cod !== '200') { container.innerHTML = `<div style="color:var(--text-muted);">Weather API error: ${data.message || 'Unknown'}</div>`; return; }
      const daily = data.list.filter((item, idx) => idx % 8 === 0).slice(0, 5);
      const days = ['Today', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
      let html = '<div class="weather-cards">';
      daily.forEach((item, idx) => {
        const date = new Date(item.dt * 1000);
        const dayName = idx === 0 ? 'Today' : days[date.getDay()];
        const temp = Math.round(item.main.temp);
        const desc = item.weather[0].description;
        const icon = item.weather[0].icon;
        html += `<div class="weather-card"><div class="day">${dayName}</div><div><img src="https://openweathermap.org/img/wn/${icon}@2x.png" style="width:50px;height:50px;" /></div><div class="temp">${temp}°C</div><div class="desc">${desc}</div></div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    }).catch(err => { console.error(err); container.innerHTML = '<div style="color:var(--text-muted);">Failed to fetch weather.</div>'; });
  }

  // ============================================================
  // 16. CHART
  // ============================================================
  function updateChart() {
    const canvas = document.getElementById('expenseChart');
    if (!canvas) return;
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    const expenses = appData.expenses || [];
    if (expenses.length === 0) { document.getElementById('chartContainer').innerHTML = '<div style="color:var(--text-muted);padding:20px;text-align:center;">Add expenses to see chart.</div>'; return; }
    const categories = { Food: 0, Travel: 0, Stay: 0, Shopping: 0, Other: 0 };
    expenses.forEach(exp => { const cat = exp.category || 'Other'; if (categories[cat] !== undefined) categories[cat] += parseFloat(exp.amount); else categories['Other'] += parseFloat(exp.amount); });
    const labels = Object.keys(categories).filter(k => categories[k] > 0);
    const data = labels.map(k => categories[k]);
    const colors = ['#3b82f6', '#10b981', '#facc15', '#8b5cf6', '#ef4444'];
    const emojis = { Food: '🍔', Travel: '🚗', Stay: '🏨', Shopping: '🛍️', Other: '📦' };
    const container = document.getElementById('chartContainer');
    container.innerHTML = '<canvas id="expenseChart" style="max-height:250px;max-width:100%;"></canvas>';
    const newCanvas = document.getElementById('expenseChart');
    chartInstance = new Chart(newCanvas.getContext('2d'), {
      type: 'doughnut',
      data: { labels: labels.map(l => `${emojis[l]||'📦'} ${l}`), datasets: [{ data: data, backgroundColor: colors.slice(0, labels.length), borderColor: 'var(--bg-card)', borderWidth: 2 }] },
      options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom', labels: { color: 'var(--text-primary)', font: { size: 12 } } } } }
    });
  }

  // ============================================================
  // 17. NAVIGATION
  // ============================================================
  function switchPage(pageId) {
    document.querySelectorAll('.sidebar .nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.sidebar .nav-item[data-page="${pageId}"]`)?.classList.add('active');
    document.querySelectorAll('.sliding-tabs button').forEach(el => el.classList.remove('active'));
    document.querySelector(`.sliding-tabs button[data-page="${pageId}"]`)?.classList.add('active');
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const target = document.getElementById('page-' + pageId);
    if (target) target.classList.add('active');
    if (pageId === 'itinerary') {
      if (!document.getElementById('map')) buildItinerary();
      else setTimeout(() => { if (mapInstance) mapInstance.invalidateSize(); }, 100);
    }
    if (pageId === 'expenses' && !document.getElementById('expenseList')) buildExpenses();
    if (pageId === 'settlements' && !document.getElementById('settlementTransactions')) buildSettlements();
    if (pageId === 'weather' && !document.getElementById('weatherContainer')) buildWeather();
    if (pageId === 'chart' && !document.getElementById('expenseChart')) buildChart();
    if (pageId === 'chat' && !document.getElementById('chatMessages')) buildChat();
    if (pageId === 'packing' && !document.getElementById('packingList')) buildPacking();
    if (pageId === 'dashboard' && !document.getElementById('participantChips')) buildDashboard();
    if (pageId === 'expenses') updateExpenses();
    if (pageId === 'settlements') calculateSettlements();
    if (pageId === 'weather') fetchWeather();
    if (pageId === 'chart') setTimeout(updateChart, 200);
    if (pageId === 'chat') updateChat();
    if (pageId === 'packing') updatePacking();
    if (pageId === 'dashboard') updateStats();
    document.getElementById('sidebar').classList.remove('open');
  }

  document.querySelectorAll('.sidebar .nav-item').forEach(item => {
    item.addEventListener('click', function() {
      const page = this.dataset.page;
      if (page) switchPage(page);
    });
  });

  document.querySelectorAll('.sliding-tabs button').forEach(item => {
    item.addEventListener('click', function() {
      const page = this.dataset.page;
      if (page) switchPage(page);
    });
  });

  document.getElementById('menuToggle').addEventListener('click', function() {
    document.getElementById('sidebar').classList.toggle('open');
  });

  // ============================================================
  // 18. DELEGATION LISTENERS (for remove buttons)
  // ============================================================
  document.addEventListener('click', function(e) {
    const partTarget = e.target.closest('[data-action="removePart"]');
    if (partTarget) {
      const name = partTarget.dataset.name;
      if (name) removeParticipant(name);
    }
    const itinTarget = e.target.closest('[data-action="removeItin"]');
    if (itinTarget) {
      const idx = parseInt(itinTarget.dataset.idx);
      if (!isNaN(idx)) removeItinerary(idx);
    }
    const expTarget = e.target.closest('[data-action="removeExpense"]');
    if (expTarget) {
      const idx = parseInt(expTarget.dataset.idx);
      if (!isNaN(idx)) removeExpense(idx);
    }
  });

  // ============================================================
  // 19. INITIALIZE
  // ============================================================
  loadTheme();

  const savedPin = localStorage.getItem('tripPin');
  if (savedPin) {
    setTimeout(() => {
      const pinInput = document.getElementById('pinInput');
      if (pinInput) {
        pinInput.value = savedPin;
        joinTrip();
      } else {
        showAuthCard();
        const pinInput2 = document.getElementById('pinInput');
        if (pinInput2) {
          pinInput2.value = savedPin;
          setTimeout(() => document.getElementById('joinTripBtn')?.click(), 50);
        }
      }
    }, 50);
  } else {
    showAuthCard();
  }

  if ('Notification' in window) {
    if (Notification.permission === 'granted') updateNotifStatus(true, 'Enabled ✅');
    else if (Notification.permission === 'denied') updateNotifStatus(false, 'Blocked ❌');
    else updateNotifStatus(false, 'Click Enable');
  } else {
    updateNotifStatus(false, 'Not supported');
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => console.log('SW registered.')).catch(err => console.log('SW registration failed:', err));
  }

  window.addParticipant = addParticipant;
  window.removeParticipant = removeParticipant;
  window.removeItinerary = removeItinerary;
  window.removeExpense = removeExpense;
  window.openEditModal = openEditModal;
  window.closeEditModal = closeEditModal;
  window.saveEditExpense = saveEditExpense;
  window.togglePacking = togglePacking;
  window.removePacking = removePacking;
  window.addPredefinedItems = addPredefinedItems;
  window.shareViaWhatsApp = shareViaWhatsApp;
  window.shareViaSMS = shareViaSMS;
  window.requestNotificationPermission = requestNotificationPermission;
  window.toggleTheme = toggleTheme;
  window.handleReceiptChange = handleReceiptChange;
  window.removeReceipt = removeReceipt;
  window.startLiveTracking = startLiveTracking;
</script>
</body>
</html>
