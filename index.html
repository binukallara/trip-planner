<!-- Trip Planner with Firebase (No Auth) + Error Handling -->
<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trip Planner</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- ========== FIREBASE SDK (NO AUTH) ========== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js">
  </script>

  <!-- Leaflet & Routing -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

  <!-- PDF Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
  </script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    /* All styles same as previous - kept minimal for brevity */
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    #trip-app { max-width: 1400px; margin: 0 auto; padding: 20px; background: #0b0e14; color: #eef2f6; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1f29; }
    ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 8px; }
    .app-header { background: #111820; border-bottom: 1px solid #1f2937; padding: 16px 24px; border-radius: 16px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .app-header h1 { font-size: 22px; font-weight: 700; color: #fff; }
    .app-header h1 i { color: #3b82f6; margin-right: 10px; }
    .app-header .badge { background: #1e293b; padding: 4px 16px; border-radius: 30px; font-size: 13px; color: #94a3b8; border: 1px solid #2d3a4f; }
    .nav-tabs { display: flex; gap: 8px; background: #131a24; padding: 8px; border-radius: 16px; margin-bottom: 24px; flex-wrap: wrap; border: 1px solid #273340; }
    .nav-tabs button { background: transparent; border: none; padding: 10px 20px; border-radius: 12px; color: #94a3b8; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; flex: 1; min-width: 80px; }
    .nav-tabs button:hover { background: #1e2838; color: #fff; }
    .nav-tabs button.active { background: #3b82f6; color: #fff; box-shadow: 0 4px 12px rgba(59,130,246,0.3); }
    .card { background: #171f2a; border: 1px solid #273340; border-radius: 20px; padding: 24px; margin-bottom: 24px; }
    .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 20px; color: #cbd5e1; }
    .card h3 i { margin-right: 10px; color: #3b82f6; }
    .input-group { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
    .input-group input, .input-group select, .input-group textarea {
      background: #0b1119; border: 1px solid #2a364a; border-radius: 12px;
      padding: 10px 16px; color: #fff; font-size: 14px; flex: 1; min-width: 150px;
      transition: 0.2s; outline: none;
    }
    .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
      border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .input-group button {
      background: #3b82f6; border: none; padding: 10px 24px; border-radius: 30px;
      font-weight: 600; color: #fff; cursor: pointer; transition: 0.2s; font-size: 14px;
      white-space: nowrap; display: flex; align-items: center; gap: 8px;
    }
    .input-group button:hover { background: #2563eb; transform: scale(1.02); }
    .btn-danger { background: #ef4444 !important; }
    .btn-danger:hover { background: #dc2626 !important; }
    .btn-success { background: #10b981 !important; }
    .btn-success:hover { background: #059669 !important; }
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .chip { background: #1e293b; padding: 5px 14px; border-radius: 30px; font-size: 13px; display: flex; align-items: center; gap: 8px; border: 1px solid #334155; }
    .chip .remove-chip { cursor: pointer; color: #94a3b8; font-size: 12px; }
    .chip .remove-chip:hover { color: #ef4444; }
    #map { height: 400px; width: 100%; border-radius: 16px; border: 1px solid #273340; background: #0b1119; z-index: 1; }
    .leaflet-routing-container { display: none !important; }
    .leaflet-control-zoom a { background: #1e293b !important; color: #e2e8f0 !important; border-color: #334155 !important; }
    .leaflet-control-zoom a:hover { background: #2d3a4f !important; }
    #navInstructions {
      background: #1a2332;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid #2d3a4f;
      margin-top: 12px;
      color: #e2e8f0;
      max-height: 250px;
      overflow-y: auto;
      font-weight: 400;
      line-height: 1.6;
      min-height: 80px;
    }
    #navInstructions .placeholder { color: #64748b; font-size: 16px; font-weight: 400; text-align: center; display: block; width: 100%; }
    #navInstructions .instruction-step { display: flex; flex-wrap: wrap; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #1e293b; font-size: 16px; gap: 4px 10px; }
    #navInstructions .instruction-step:last-child { border-bottom: none; }
    #navInstructions .step-number { color: #94a3b8; font-weight: 600; min-width: 30px; font-size: 14px; }
    #navInstructions .step-text { flex: 1; color: #f1f5f9; font-weight: 500; }
    #navInstructions .step-distance { color: #60a5fa; font-weight: 500; font-size: 13px; background: #0b1119; padding: 1px 10px; border-radius: 20px; white-space: nowrap; }
    #navInstructions .step-time { color: #94a3b8; font-size: 12px; white-space: nowrap; }
    .list-item { background: #111a24; border-radius: 12px; padding: 14px 18px; border-left: 4px solid #3b82f6; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .list-item .info { display: flex; flex-direction: column; gap: 2px; }
    .list-item .info .title { font-weight: 600; color: #f1f5f9; }
    .list-item .info .sub { font-size: 13px; color: #94a3b8; }
    .list-item .amount { font-weight: 700; color: #facc15; }
    .receipt-thumb { max-width: 60px; max-height: 60px; border-radius: 8px; cursor: pointer; border: 1px solid #334155; }
    .settlement-item { background: #1a2332; border-radius: 12px; padding: 16px 20px; border: 1px solid #2d3a4f; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .settlement-item .from { color: #f87171; font-weight: 700; }
    .settlement-item .to { color: #34d399; font-weight: 700; }
    .settlement-item .s-amount { color: #facc15; font-weight: 700; font-size: 18px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .stat-box { background: #111a24; padding: 16px; border-radius: 14px; border: 1px solid #273340; text-align: center; }
    .stat-box .label { color: #94a3b8; font-size: 13px; }
    .stat-box .value { font-size: 26px; font-weight: 700; color: #fff; margin-top: 4px; }
    .stat-box .green { color: #34d399; }
    .stat-box .red { color: #f87171; }
    .stat-box .blue { color: #60a5fa; }
    .page { display: none; animation: fadeIn 0.3s ease; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .auth-overlay {
      display: flex;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 99999;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }
    .auth-box {
      background: #171f2a;
      border: 1px solid #2d3a4f;
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      color: #e2e8f0;
      box-shadow: 0 30px 80px rgba(0,0,0,0.9);
    }
    .auth-box h2 { font-size: 24px; margin-bottom: 8px; color: #fff; }
    .auth-box h2 i { color: #3b82f6; margin-right: 10px; }
    .auth-box p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .auth-box .input-group { justify-content: center; }
    .auth-box .input-group input {
      text-align: center;
      font-size: 24px;
      letter-spacing: 8px;
      max-width: 180px;
      padding: 12px;
    }
    .auth-box .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .auth-box .btn-group button {
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      color: #fff;
      flex: 1;
      min-width: 120px;
    }
    .auth-box .btn-group .primary-btn { background: #3b82f6; }
    .auth-box .btn-group .primary-btn:hover { background: #2563eb; }
    .auth-box .btn-group .secondary-btn { background: #10b981; }
    .auth-box .btn-group .secondary-btn:hover { background: #059669; }
    .auth-box .error-msg { color: #ef4444; font-size: 14px; margin-top: 12px; min-height: 20px; }
    @media (max-width: 700px) { 
      .grid-2 { grid-template-columns: 1fr; } 
      .input-group { flex-direction: column; align-items: stretch; }
      .auth-box { padding: 30px 20px; }
    }
  </style>
</head>
<body>

  <!-- ========== AUTH / JOIN SCREEN ========== -->
  <div id="authScreen" class="auth-overlay">
    <div class="auth-box">
      <h2><i class="fas fa-plane-departure"></i> Trip Planner</h2>
      <p>Start a new trip or join an existing one with a PIN.</p>
      <div class="input-group">
        <input type="text" id="pinInput" maxlength="4" placeholder="Enter PIN" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div id="authError" class="error-msg"></div>
      <div class="btn-group">
        <button class="secondary-btn" id="joinTripBtn"><i class="fas fa-sign-in-alt"></i> Join Trip</button>
        <button class="primary-btn" id="newTripBtn"><i class="fas fa-plus"></i> New Trip</button>
      </div>
    </div>
  </div>

  <!-- ========== MAIN APP ========== -->
  <div id="trip-app" style="display:none;"></div>

  <script>
    // ======================================================
    // 1. FIREBASE CONFIG (YOUR CONFIG)
    // ======================================================
    const firebaseConfig = {
      apiKey: "AIzaSyDHFcRRJo_OzuPla9TTLQKTqP0psyrVU1Y",
      authDomain: "trip-planner-cacaf.firebaseapp.com",
      databaseURL: "https://trip-planner-cacaf-default-rtdb.firebaseio.com",
      projectId: "trip-planner-cacaf",
      storageBucket: "trip-planner-cacaf.firebasestorage.app",
      messagingSenderId: "829860320918",
      appId: "1:829860320918:web:4062460a825314a49414b7",
      measurementId: "G-0MX66HVEK7"
    };

    // ======================================================
    // 2. INIT FIREBASE (NO AUTH)
    // ======================================================
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentTripPin = null;
    let isSyncing = false;
    let isLocalUpdate = false;

    // ======================================================
    // 3. MAIN APP DATA
    // ======================================================
    let appData = {
      tripName: 'New Trip',
      tripDate: new Date().toISOString().split('T')[0],
      participants: [],
      itinerary: [],
      expenses: [],
      createdAt: Date.now()
    };

    let mapInstance = null;
    let mapMarkers = [];
    let mapPolyline = null;
    let routingControl = null;
    let userMarker = null;
    let tempMarker = null;
    let watchId = null;
    let isNavigating = false;

    // ======================================================
    // 4. CLEANUP EXPIRED TRIPS (15 days)
    // ======================================================
    function cleanupExpiredTrips() {
      const now = Date.now();
      const expiryMs = 15 * 24 * 60 * 60 * 1000;

      const storedPin = localStorage.getItem('tripPin');
      const storedData = localStorage.getItem('tripData');
      if (storedPin && storedData) {
        try {
          const data = JSON.parse(storedData);
          if (data.createdAt && (now - data.createdAt) > expiryMs) {
            console.log('⚠️ Local trip expired, removing...');
            localStorage.removeItem('tripPin');
            localStorage.removeItem('tripData');
          }
        } catch (e) {}
      }

      database.ref('trips').once('value').then(snapshot => {
        if (!snapshot.exists()) return;
        const trips = snapshot.val();
        const toDelete = [];
        for (const [pin, trip] of Object.entries(trips)) {
          if (trip.createdAt && (now - trip.createdAt) > expiryMs) {
            toDelete.push(pin);
          }
        }
        if (toDelete.length > 0) {
          console.log(`🗑️ Deleting ${toDelete.length} expired trips from Firebase.`);
          const updates = {};
          toDelete.forEach(pin => { updates['trips/' + pin] = null; });
          database.ref().update(updates);
        }
      }).catch(err => console.warn('Cleanup error:', err));
    }

    // ======================================================
    // 5. TRIP CREATE / JOIN (NO AUTH)
    // ======================================================
    function showAuthScreen() {
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('trip-app').style.display = 'none';
    }

    function hideAuthScreen() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('trip-app').style.display = 'block';
    }

    function setError(msg) { document.getElementById('authError').textContent = msg; }
    function clearError() { document.getElementById('authError').textContent = ''; }

    function generatePin() { return String(Math.floor(1000 + Math.random() * 9000)); }

    function checkTripExists(pin) {
      return database.ref('trips/' + pin).once('value').then(snapshot => snapshot.exists());
    }

    // ----- Sync with error handling -----
    function syncToFirebase() {
      if (!currentTripPin) {
        alert('No active trip. Please create or join a trip first.');
        return;
      }
      isLocalUpdate = true;
      if (!appData.createdAt) {
        appData.createdAt = firebase.database.ServerValue.TIMESTAMP;
      }
      database.ref('trips/' + currentTripPin).set(appData)
        .then(() => {
          isLocalUpdate = false;
          // Update sync status
          const status = document.getElementById('syncStatus');
          if (status) {
            status.innerHTML = '✅ Synced';
            setTimeout(() => {
              if (status) status.innerHTML = 'Real-time sync enabled 🔄';
            }, 2000);
          }
        })
        .catch(err => {
          isLocalUpdate = false;
          console.error('Sync error:', err);
          alert('❌ Failed to save data to Firebase: ' + err.message + '\n\nCheck your Firebase rules. They must allow read/write.');
        });
    }

    // Override all CRUD functions to call syncToFirebase with error handling
    // We'll replace the existing functions in the main code.

    // ======================================================
    // 6. REAL-TIME LISTENER
    // ======================================================
    function startRealtimeListener(pin) {
      if (isSyncing) return;
      isSyncing = true;

      database.ref('trips/' + pin).on('value', (snapshot) => {
        if (!snapshot.exists()) {
          localStorage.removeItem('tripPin');
          localStorage.removeItem('tripData');
          alert('This trip has been deleted from the server.');
          window.location.reload();
          return;
        }
        const remoteData = snapshot.val();
        if (isLocalUpdate) { isLocalUpdate = false; return; }
        appData = remoteData;
        localStorage.setItem('tripData', JSON.stringify(appData));
        reRenderAll();
      }, (error) => {
        console.error('Firebase sync error:', error);
        alert('Real-time sync error: ' + error.message);
      });
    }

    // ======================================================
    // 7. CREATE / JOIN functions (with error handling)
    // ======================================================
    function createNewTrip() {
      clearError();
      cleanupExpiredTrips();

      const pin = generatePin();
      checkTripExists(pin).then(exists => {
        if (exists) { createNewTrip(); return; }
        const newTripData = {
          tripName: 'My Trip',
          tripDate: new Date().toISOString().split('T')[0],
          participants: [],
          itinerary: [],
          expenses: [],
          createdAt: firebase.database.ServerValue.TIMESTAMP
        };
        return database.ref('trips/' + pin).set(newTripData)
          .then(() => {
            currentTripPin = pin;
            appData = newTripData;
            localStorage.setItem('tripData', JSON.stringify(appData));
            localStorage.setItem('tripPin', pin);
            hideAuthScreen();
            buildUI();
            // Start listener
            startRealtimeListener(pin);
            setTimeout(() => showShareModal(pin), 500);
          })
          .catch(err => {
            setError('Failed to create trip: ' + err.message);
            console.error(err);
          });
      }).catch(err => { console.error(err);
        setError('Error: ' + err.message); });
    }

    function joinTrip() {
      clearError();
      const pinInput = document.getElementById('pinInput');
      const pin = pinInput.value.trim();
      if (!pin || pin.length !== 4 || isNaN(pin)) {
        setError('Please enter a valid 4-digit PIN.');
        return;
      }
      cleanupExpiredTrips();

      database.ref('trips/' + pin).once('value').then(snapshot => {
        if (!snapshot.exists()) {
          setError('Trip not found with this PIN.');
          return;
        }
        const data = snapshot.val();
        const now = Date.now();
        const expiryMs = 15 * 24 * 60 * 60 * 1000;
        if (data.createdAt && (now - data.createdAt) > expiryMs) {
          database.ref('trips/' + pin).remove().then(() => {
            setError('❌ This trip has expired (15 days). Deleted from server.');
          });
          return;
        }
        currentTripPin = pin;
        appData = data;
        localStorage.setItem('tripData', JSON.stringify(appData));
        localStorage.setItem('tripPin', pin);
        hideAuthScreen();
        buildUI();
        startRealtimeListener(pin);
      }).catch(err => { console.error(err);
        setError('Error joining trip: ' + err.message); });
    }

    // ======================================================
    // 8. RE-RENDER
    // ======================================================
    function reRenderAll() {
      document.getElementById('tripName').value = appData.tripName || '';
      document.getElementById('tripDate').value = appData.tripDate || '';
      renderParticipants();
      renderItinerary();
      renderExpenses();
      updateStats();
      updateSelects();
      if (mapInstance) updateMapMarkers();
      const settlePage = document.getElementById('page-settlements');
      if (settlePage && settlePage.classList.contains('active')) calculateSettlements();
    }

    // ======================================================
    // 9. SHARE MODAL
    // ======================================================
    function showShareModal(pin) {
      const modal = document.createElement('div');
      modal.id = 'shareModal';
      modal.style.cssText = `
        display:flex; position:fixed; top:0; left:0; width:100%; height:100%;
        background:rgba(0,0,0,0.7); z-index:99999; justify-content:center; align-items:center;
        animation:fadeIn 0.3s ease;
      `;
      modal.innerHTML = `
        <div class="auth-box" style="max-width:450px; background:#171f2a; border:1px solid #2d3a4f; border-radius:24px; padding:30px; text-align:center; color:#e2e8f0; box-shadow:0 30px 80px rgba(0,0,0,0.9);">
          <h2 style="font-size:24px; margin-bottom:8px; color:#fff;"><i class="fas fa-share-alt" style="color:#8b5cf6; margin-right:10px;"></i> Share Your Trip</h2>
          <p style="color:#94a3b8; font-size:14px; margin-bottom:20px;">Share this PIN with your team to join this trip in real-time.</p>
          <div style="background:#0b1119; padding:16px; border-radius:16px; border:1px solid #2a364a; margin-bottom:20px;">
            <div style="color:#94a3b8; font-size:13px; font-weight:500;">🔑 Your Trip PIN</div>
            <div style="font-size:42px; font-weight:700; color:#facc15; letter-spacing:12px; margin-top:4px;">${pin}</div>
          </div>
          <div style="margin-top:12px; color:#64748b; font-size:12px;">Share this PIN via WhatsApp, Email, or any messaging app.</div>
          <button onclick="this.closest('#shareModal').remove()" style="margin-top:16px; padding:12px 28px; border:none; border-radius:30px; font-weight:600; font-size:15px; cursor:pointer; color:#fff; background:#3b82f6;">Got it</button>
        </div>
      `;
      document.body.appendChild(modal);
      modal.addEventListener('click', function(e) {
        if (e.target === modal) modal.remove();
      });
    }

    // ======================================================
    // 10. RENDER FUNCTIONS
    // ======================================================
    function renderParticipants() {
      const c = document.getElementById('participantChips');
      if (!c) return;
      c.innerHTML = appData.participants.map(p =>
        `<div class="chip">${p} <span class="remove-chip" data-action="removePart" data-name="${p}"><i class="fas fa-times"></i></span></div>`
      ).join('');
      updateSelects();
      updateStats();
    }

    function updateSelects() {
      const paidBy = document.getElementById('expPaidBy');
      if (!paidBy) return;
      const opts = appData.participants.map(p => `<option value="${p}">${p}</option>`).join('');
      paidBy.innerHTML = `<option value="">-- Paid By --</option>${opts}`;
      renderExpenses();
    }

    function renderItinerary() {
      const c = document.getElementById('itineraryList');
      if (!c) return;
      if (appData.itinerary.length === 0) {
        c.innerHTML = '<div style="color:#64748b;padding:16px;">No places added yet.</div>';
      } else {
        c.innerHTML = appData.itinerary.map((item, idx) => `
          <div class="list-item" style="border-left-color:#10b981;">
            <div class="info">
              <div class="title">📍 ${item.name}</div>
              <div class="sub">🕒 ${item.time || 'Time not set'} | Lat: ${item.lat || 'N/A'}, Lng: ${item.lng || 'N/A'}</div>
              <div class="sub">${item.desc || ''}</div>
            </div>
            <div><button class="btn-danger" style="border:none;padding:4px 12px;border-radius:20px;color:#fff;cursor:pointer;" data-action="removeItin" data-idx="${idx}"><i class="fas fa-trash"></i></button></div>
          </div>
        `).join('');
      }
      document.getElementById('itineraryCount').innerText = `(${appData.itinerary.length} places)`;
      document.getElementById('dashPlaceCount').innerText = appData.itinerary.length;
      updateMapMarkers();
    }

    function renderExpenses() {

    function initMap() {
      const defaultLoc = [10.089, 77.059];
      if (typeof L === 'undefined') {
        document.getElementById('map').innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444;">⚠️ Leaflet library not loaded.</div>';
        return;
      }
      if (mapInstance) { mapInstance.remove();

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(mapInstance);
      L.control.zoom({ position: 'bottomright' }).addTo(mapInstance);
      mapInstance.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);
        document.getElementById('placeLat').value = lat;
        document.getElementById('placeLng').value = lng;
        if (tempMarker) mapInstance.removeLayer(tempMarker);
        tempMarker = L.marker(e.latlng, { draggable: true })
          .addTo(mapInstance)
          .bindPopup(`Lat: ${lat}<br>Lng: ${lng}`)
          .openPopup();
        tempMarker.on('dragend', function() {
          const pos = tempMarker.getLatLng();
          document.getElementById('placeLat').value = pos.lat.toFixed(6);
          document.getElementById('placeLng').value = pos.lng.toFixed(6);
        });
      });
      if (isNavigating) startLiveTracking();
      updateMapMarkers();

    function parseInstructions(routes) {
      if (!routes || routes.length === 0) return { steps: [], totalDistance: 0, totalTime: 0 };
      const route = routes[0];
      let steps = [];
      let totalDistance = 0;
      let totalTime = 0;
      if (route.summary) {
        totalDistance = route.summary.totalDistance || 0;
        totalTime = route.summary.totalTime || 0;
      }
      if (route.legs && route.legs.length > 0) {
        route.legs.forEach(leg => { if (leg.steps) steps = steps.concat(leg.steps); });
      } else if (route.steps) {
        steps = route.steps;
      } else if (route.instructions) {
        steps = route.instructions;
      }
      return { steps, totalDistance, totalTime };
    }

    function updateInstructionsDisplay(steps, totalDistance, totalTime) {
      const container = document.getElementById('navInstructions');
      if (!container) return;
      if (!steps || steps.length === 0) {
        container.innerHTML = '<span class="placeholder">No turn-by-turn instructions available.</span>';
        return;
      }
      let html = '';
      steps.forEach((step, idx) => {
        let text = step.instruction || step.text || step.name || '';
        let distance = step.distance || 0;
        let time = step.duration || 0;
        text = text.replace(/\s+/g, ' ').trim();
        let distStr = '';
        if (distance > 0) {
          if (distance >= 1000) distStr = (distance / 1000).toFixed(1) + ' km';
          else distStr = Math.round(distance) + ' m';
        }
        let timeStr = '';
        if (time > 0) {
          if (time >= 60) {
            const mins = Math.floor(time / 60);
            const secs = Math.round(time % 60);
            timeStr = mins + ' min' + (secs > 0 ? ' ' + secs + 's' : '');
          } else {
            timeStr = Math.round(time) + 's';
          }
        }
        html += `
          <div class="instruction-step">
            <span class="step-number">${idx + 1}.</span>
            <span class="step-text">${text}</span>
            ${distStr ? `<span class="step-distance">${distStr}</span>` : ''}
            ${timeStr ? `<span class="step-time">${timeStr}</span>` : ''}
          </div>
        `;
      });
      let summary = '';
      if (totalDistance > 0) summary += `📏 <strong>${(totalDistance/1000).toFixed(1)} km</strong>`;
      if (totalTime > 0) summary += ` ⏱️ <strong>${Math.floor(totalTime/60)} min</strong>`;
      container.innerHTML = `
        <div class="instructions-summary">${summary}</div>
        <div class="instructions-list">${html}</div>
      `;
    }

    function updateMapMarkers() {
      if (!mapInstance) return;
      mapMarkers.forEach(m => { if (mapInstance.hasLayer(m)) mapInstance.removeLayer(m); });
      mapMarkers = [];
      if (routingControl) { mapInstance.removeControl(routingControl);
        routingControl = null; }
      if (appData.itinerary.length === 0) {
        mapInstance.setView([10.089, 77.059], 10);
        document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Add places to see route and instructions.</span>';
        return;
      }
      const waypoints = [];
      const latlngs = [];
      appData.itinerary.forEach((item, idx) => {
        const lat = parseFloat(item.lat);
        const lng = parseFloat(item.lng);
        if (isNaN(lat) || isNaN(lng)) return;
        const pos = [lat, lng];
        latlngs.push(pos);
        waypoints.push(L.latLng(lat, lng));
        const marker = L.marker(pos, { title: item.name })
          .bindPopup(`<b>${item.name}</b><br>${item.desc || ''}`)
          .addTo(mapInstance);
        mapMarkers.push(marker);
      });
      if (latlngs.length === 1) {
        mapInstance.setView(latlngs[0], 12);
        document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Add more places to plan a route.</span>';
      } else if (latlngs.length > 1) {
        try {
          routingControl = L.Routing.control({
            waypoints: waypoints,
            routeWhileDragging: false,
            showAlternatives: false,
            fitSelectedRoutes: true,
            addWaypoints: false,
            draggableWaypoints: false,
            show: false,
            createMarker: function() { return null; },
            lineOptions: { styles: [{ color: '#3b82f6', weight: 4, opacity: 0.8 }] },
            router: L.Routing.osrmv1({ serviceUrl: 'https://router.project-osrm.org/route/v1' })
          }).addTo(mapInstance);
          routingControl.on('routesfound', function(e) {
            const routes = e.routes;
            if (!routes || routes.length === 0) {
              document.getElementById('navInstructions').innerHTML = '<span class="placeholder">No route found.</span>';
              return;
            }
            const { steps, totalDistance, totalTime } = parseInstructions(routes);
            updateInstructionsDisplay(steps, totalDistance, totalTime);
          });
          routingControl.on('routingerror', function(e) {
            document.getElementById('navInstructions').innerHTML = '<span style="color:#ef4444;">❌ Could not calculate route.</span>';
          });
          setTimeout(() => { if (routingControl) routingControl.route(); }, 500);
        } catch (e) {
          console.error('Routing error:', e);
          if (latlngs.length > 0) {
            mapPolyline = L.polyline(latlngs, { color: '#3b82f6', weight: 4, opacity: 0.8 }).addTo(mapInstance);
            const bounds = L.latLngBounds(latlngs);
            mapInstance.fitBounds(bounds, { padding: [30, 30] });
          }
          document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Routing unavailable. Showing simple path.</span>';
        }
      }
      if (userMarker && !mapInstance.hasLayer(userMarker)) userMarker.addTo(mapInstance);
    }

    // ========== LIVE TRACKING ==========
    function startLiveTracking() {
      if (!navigator.geolocation) { document.getElementById('locationStatus').innerHTML = '❌ GPS not supported.'; return; }
      if (watchId) { navigator.geolocation.clearWatch(watchId);
        watchId = null; }
      document.getElementById('locationStatus').innerHTML = '📍 GPS Active...';
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;
          document.getElementById('locationStatus').innerHTML =
            `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)} (accuracy: ${Math.round(accuracy)}m)`;
          if (mapInstance) {
            if (userMarker) {
              userMarker.setLatLng([lat, lng]);
            } else {
              const icon = L.divIcon({
                className: 'fa-solid fa-location-dot',
                iconSize: [24, 24],
                html: '<i class="fas fa-location-dot" style="color:#3b82f6;font-size:28px;text-shadow:0 0 10px rgba(59,130,246,0.5);"></i>'
              });
              userMarker = L.marker([lat, lng], { icon: icon, title: 'You are here' }).addTo(mapInstance).bindPopup(
                '📍 You are here!');
            }
            if (isNavigating) mapInstance.flyTo([lat, lng], 15, { duration: 1 });
          }
        },
        (err) => { document.getElementById('locationStatus').innerHTML = `❌ GPS Error: ${err.message}`;
          watchId = null; }, {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 5000
        }
      );
    }

    function stopLiveTracking() {
      if (watchId) { navigator.geolocation.clearWatch(watchId);
        watchId = null;
        document.getElementById('locationStatus').innerHTML = '⏹️ GPS stopped.'; }
      if (userMarker && mapInstance) { mapInstance.removeLayer(userMarker);
        userMarker = null; }
    }

    function toggleNavigation() {
      if (isNavigating) {
        isNavigating = false;
        stopLiveTracking();
        document.getElementById('navToggleBtn').innerHTML = '<i class="fas fa-play"></i> Start Navigation';
        document.getElementById('navToggleBtn').className = 'btn-success';
        document.getElementById('navInstructions').innerHTML = '<span class="placeholder">Navigation stopped.</span>';
        return;
      }
      if (appData.itinerary.length < 2) {
        alert('Please add at least 2 places to your itinerary for navigation.');
        return;
      }
      isNavigating = true;
      document.getElementById('navToggleBtn').innerHTML = '<i class="fas fa-stop"></i> Stop Navigation';
      document.getElementById('navToggleBtn').className = 'btn-danger';
      if (!watchId) startLiveTracking();
      else if (userMarker) { const latlng = userMarker.getLatLng();
        mapInstance.flyTo(latlng, 15, { duration: 1 }); }
      if (routingControl) routingControl.route();
    }

        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;

      fetch(url).then(res => res.json()).then(data => {

          document.getElementById('placeName').value = result.display_name || query;
          document.getElementById('placeLat').value = lat;
          document.getElementById('placeLng').value = lng;
          document.getElementById('searchStatus').innerHTML = '✅ Found!';
          if (mapInstance) {
            if (tempMarker) mapInstance.removeLayer(tempMarker);

              `Lat: ${lat}<br>Lng: ${lng}`).openPopup();

    function getSettlementData() {
      const participants = appData.participants;
      const expenses = appData.expenses;
      const totalPaid = {};
      participants.forEach(p => totalPaid[p] = 0);
      expenses.forEach(exp => {
        const amt = parseFloat(exp.amount);
        if (totalPaid[exp.paidBy] !== undefined) totalPaid[exp.paidBy] += amt;
      });
      const totalCost = expenses.reduce((s, e) => s + parseFloat(e.amount), 0);
      const share = participants.length > 0 ? totalCost / participants.length : 0;
      const netBalance = {};
      participants.forEach(p => { netBalance[p] = totalPaid[p] - share; });
      return { participants, totalPaid, totalCost, share, netBalance };
    }

    function calculateSettlements() {
      const container = document.getElementById('settlementTransactions');
      const summary = document.getElementById('settlementSummary');
      const participants = appData.participants;
      if (participants.length === 0) { container.innerHTML = '<div style="color:#ef4444;">Add participants first!</div>'; return; }
      if (appData.expenses.length === 0) { container.innerHTML = '<div style="color:#94a3b8;">No expenses to settle.</div>'; return; }
      const { totalPaid, totalCost, share, netBalance } = getSettlementData();
      summary.innerHTML = `
        <div class="stat-box"><div class="label">Total Cost</div><div class="value blue">₹${totalCost.toFixed(2)}</div></div>
        <div class="stat-box"><div class="label">Per Person Share</div><div class="value">₹${share.toFixed(2)}</div></div>
        ${participants.map(p => `
          <div class="stat-box">
            <div class="label">${p} (Paid ₹${totalPaid[p].toFixed(2)})</div>
            <div class="value ${netBalance[p] >= 0 ? 'green' : 'red'}">${netBalance[p] >= 0 ? '+' : ''}${netBalance[p].toFixed(2)}</div>
          </div>
        `).join('')}
      `;
      let payers = participants.filter(p => netBalance[p] < 0).map(p => ({ name: p, amount: -netBalance[p] }));
      let receivers = participants.filter(p => netBalance[p] > 0).map(p => ({ name: p, amount: netBalance[p] }));
      let transactions = [];
      let i = 0,
        j = 0;
      while (i < payers.length && j < receivers.length) {
        let payer = payers[i],
          receiver = receivers[j];
        let settleAmt = Math.min(payer.amount, receiver.amount);
        if (settleAmt > 0.01) { transactions.push({ from: payer.name, to: receiver.name, amount: settleAmt }); }
        payer.amount -= settleAmt;
        receiver.amount -= settleAmt;
        if (payer.amount < 0.01) i++;
        if (receiver.amount < 0.01) j++;
      }
      if (transactions.length === 0) {
        container.innerHTML = '<div style="color:#34d399;font-weight:600;">✅ All settled!</div>';
      } else {
        container.innerHTML = transactions.map(t => `
          <div class="settlement-item">
            <div><span class="from">${t.from}</span> <i class="fas fa-arrow-right" style="color:#94a3b8;margin:0 12px;"></i> <span class="to">${t.to}</span></div>
            <div class="s-amount">₹${t.amount.toFixed(2)}</div>
          </div>
        `).join('');
      }
    }

          alert('jsPDF not found.'); return; }
        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const doc = new jsPDFConstructor('p', 'mm', 'a4');
        const pdfWidth = 210;
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        doc.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
        doc.save(`Settlement_${appData.tripName || 'Trip'}.pdf`);
        document.body.removeChild(tempDiv);
      }).catch(err => { console.error(err);
        document.body.removeChild(tempDiv);
        alert('PDF generation failed: ' + err.message); });
    }

    // ========== CRUD functions (overridden with sync) ==========
    function addParticipant() {
      const input = document.getElementById('participantInput');
      const name = input.value.trim();
      if (!name) return alert('Enter a name.');
      if (appData.participants.includes(name)) return alert('Already exists.');
      appData.participants.push(name);
      input.value = '';
      renderParticipants();
      updateSelects();
      updateStats();
      syncToFirebase();
    }

    function removeParticipant(name) {
      if (!confirm(`Remove ${name}?`)) return;
      appData.participants = appData.participants.filter(p => p !== name);
      renderParticipants();
      updateSelects();
      updateStats();
      syncToFirebase();
    }

    function addPlace() {
      const name = document.getElementById('placeName').value.trim();
      const time = document.getElementById('placeTime').value;
      const lat = document.getElementById('placeLat').value.trim();
      const lng = document.getElementById('placeLng').value.trim();
      const desc = document.getElementById('placeDesc').value.trim();
      if (!name) return alert('Enter place name.');
      if (!lat || !lng) return alert('Please enter Latitude and Longitude.');
      appData.itinerary.push({ id: generateId(), name, time, lat, lng, desc });
      document.getElementById('placeName').value = '';
      document.getElementById('placeTime').value = '';
      document.getElementById('placeLat').value = '';
      document.getElementById('placeLng').value = '';
      document.getElementById('placeDesc').value = '';
      if (tempMarker) { mapInstance.removeLayer(tempMarker);
        tempMarker = null; }
      renderItinerary();
      syncToFirebase();
    }

    function removeItinerary(idx) {
      appData.itinerary.splice(idx, 1);
      renderItinerary();
      syncToFirebase();
    }

    function addExpense() {
      const desc = document.getElementById('expDesc').value.trim();
      const amount = parseFloat(document.getElementById('expAmount').value);
      const paidBy = document.getElementById('expPaidBy').value;
      const fileInput = document.getElementById('expReceipt');
      const file = fileInput.files[0];
      if (!desc) return alert('Enter description.');
      if (isNaN(amount) || amount <= 0) return alert('Enter valid amount.');
      if (!paidBy) return alert('Select who paid.');
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          if (dataUrl.length > 2 * 1024 * 1024) { alert('File too large (max 2MB).'); return; }
          appData.expenses.push({ id: generateId(), desc, amount, paidBy, receipt: dataUrl });
          fileInput.value = '';
          document.getElementById('removeReceiptBtn').style.display = 'none';
          renderExpenses();
          syncToFirebase();
        };
        reader.readAsDataURL(file);
      } else {
        appData.expenses.push({ id: generateId(), desc, amount, paidBy, receipt: null });
        renderExpenses();
        syncToFirebase();
      }
      document.getElementById('expDesc').value = '';
      document.getElementById('expAmount').value = '';
    }

    function removeExpense(idx) {
      if (!confirm('Remove this expense?')) return;
      appData.expenses.splice(idx, 1);
      renderExpenses();
      syncToFirebase();
    }

    function handleReceiptChange() {
      const fileInput = document.getElementById('expReceipt');
      const removeBtn = document.getElementById('removeReceiptBtn');
      if (fileInput.files.length > 0) { removeBtn.style.display = 'inline-block'; } else { removeBtn.style.display = 'none'; }
    }

    function removeReceipt() {
      document.getElementById('expReceipt').value = '';
      document.getElementById('removeReceiptBtn').style.display = 'none';
    }

    function updateTrip() {
      const name = document.getElementById('tripName').value.trim();
      const date = document.getElementById('tripDate').value;
      if (name) appData.tripName = name;
      appData.tripDate = date;
      document.getElementById('tripStatus').innerHTML = `📅 ${date} | ${appData.tripName}`;
      syncToFirebase();
    }

    function generateId() { return Date.now() + Math.random().toString(36); }

    // ========== NAVIGATION ==========
    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      document.querySelectorAll('.nav-tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.nav-tabs button').forEach(b => { if (b.dataset.page === pageId) b.classList.add('active'); });
      if (pageId === 'itinerary' && mapInstance) { setTimeout(() => mapInstance.invalidateSize(), 100); }
      if (pageId === 'settlements') calculateSettlements();
    }

    function startNewTrip() {
      if (!confirm('Are you sure you want to clear all data and start a new trip?')) return;
      cleanupExpiredTrips();
      if (isSyncing) {
        database.ref('trips/' + currentTripPin).off();
        isSyncing = false;
      }
      localStorage.removeItem('tripData');
      localStorage.removeItem('tripPin');
      currentTripPin = null;
      appData = { tripName: 'New Trip', tripDate: new Date().toISOString().split('T')[0], participants: [], itinerary: [],
        expenses: [], createdAt: Date.now() };
      document.getElementById('trip-app').innerHTML = '';
      document.getElementById('trip-app').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
      document.getElementById('pinInput').value = '';
    }

    // ======================================================
    // 13. BUILD UI
    // ======================================================
    function buildUI() {
      const app = document.getElementById('trip-app');
      app.innerHTML = `
        <div class="app-header">
          <h1><i class="fas fa-plane-departure"></i> Trip Planner</h1>
          <div class="badge" id="tripStatus">📅 ${appData.tripDate} | ${appData.tripName}</div>
        </div>

        <div class="nav-tabs">
          <button data-page="dashboard" class="active"><i class="fas fa-home"></i> Dashboard</button>
          <button data-page="itinerary"><i class="fas fa-map-marked-alt"></i> Itinerary</button>
          <button data-page="expenses"><i class="fas fa-wallet"></i> Expenses</button>
          <button data-page="settlements"><i class="fas fa-hand-holding-usd"></i> Settle</button>
        </div>

        <div id="page-dashboard" class="page active">
          <div class="card">
            <h3><i class="fas fa-users"></i> Trip Setup</h3>
            <div class="input-group">
              <input type="text" id="tripName" placeholder="Trip Name" value="${appData.tripName}">
              <input type="date" id="tripDate" value="${appData.tripDate}">
              <button id="updateTripBtn"><i class="fas fa-save"></i> Update</button>
              <button id="startNewTripBtn" class="btn-danger"><i class="fas fa-trash-alt"></i> New Trip</button>
            </div>
            <div class="input-group">
              <input type="text" id="participantInput" placeholder="Add participant name">
              <button id="addParticipantBtn"><i class="fas fa-user-plus"></i> Add</button>
            </div>
            <div id="participantChips" class="chip-group"></div>
            <div style="margin-top:12px; color:#60a5fa; font-size:13px; background:#0b1119; padding:8px 16px; border-radius:10px; border:1px solid #1e293b;">
              <i class="fas fa-sync"></i> <span id="syncStatus">Real-time sync enabled 🔄</span>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <h3><i class="fas fa-route"></i> Quick Stats</h3>
              <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <div class="stat-box" style="flex:1;"><div class="label">Total Cost</div><div class="value blue" id="dashTotalCost">₹0</div></div>
                <div class="stat-box" style="flex:1;"><div class="label">Members</div><div class="value" id="dashParticipantCount">0</div></div>
                <div class="stat-box" style="flex:1;"><div class="label">Places</div><div class="value" id="dashPlaceCount">0</div></div>
              </div>
            </div>
            <div class="card">
              <h3><i class="fas fa-map"></i> Live Location</h3>
              <button id="trackLocationBtn" class="btn-success" style="padding:10px 20px;border-radius:30px;border:none;color:#fff;font-weight:600;cursor:pointer;"><i class="fas fa-location-dot"></i> Track My Location</button>
              <div id="locationStatus" style="margin-top:10px;color:#94a3b8;font-size:14px;">Click to get your current position.</div>
            </div>
          </div>
        </div>

        <div id="page-itinerary" class="page">
          <div class="card">
            <h3><i class="fas fa-plus-circle"></i> Add New Place</h3>
            <div class="input-group">
              <input type="text" id="placeName" placeholder="Enter place name" style="flex:2;">
              <button id="searchPlaceBtn" style="background:#10b981;"><i class="fas fa-search"></i> Search</button>
              <span id="searchStatus" style="color:#94a3b8; font-size:13px;"></span>
            </div>
            <div style="color:#94a3b8; font-size:13px; margin-bottom:8px;">💡 Click on the map to set coordinates.</div>
            <div class="input-group">
              <input type="datetime-local" id="placeTime">
              <input type="text" id="placeLat" placeholder="Latitude">
              <input type="text" id="placeLng" placeholder="Longitude">
            </div>
            <div class="input-group">
              <textarea id="placeDesc" placeholder="Description..." rows="2"></textarea>
              <button id="addPlaceBtn"><i class="fas fa-map-pin"></i> Add</button>
            </div>
          </div>
          <div class="card">
            <h3><i class="fas fa-list"></i> Itinerary <span id="itineraryCount"></span></h3>
            <div id="itineraryList"></div>
          </div>
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h3 style="font-size:16px; font-weight:600; color:#cbd5e1; margin:0;"><i class="fas fa-map"></i> Navigation</h3>
              <button id="navToggleBtn" class="btn-success" style="padding:8px 20px; border:none; border-radius:30px; color:#fff; font-weight:600; cursor:pointer;">
                <i class="fas fa-play"></i> Start
              </button>
            </div>
            <div id="map"></div>
            <div id="navInstructions"><span class="placeholder">Add places to see route.</span></div>
          </div>
        </div>

        <div id="page-expenses" class="page">
          <div class="card">
            <h3><i class="fas fa-receipt"></i> Add Expense</h3>
            <div class="input-group">
              <input type="text" id="expDesc" placeholder="Description">
              <input type="number" id="expAmount" placeholder="Amount (₹)">
              <select id="expPaidBy"><option value="">-- Paid By --</option></select>
            </div>
            <div class="input-group">
              <input type="file" id="expReceipt" accept="image/*,.pdf" onchange="handleReceiptChange()">
              <button id="removeReceiptBtn" class="btn-danger" style="display:none;" onclick="removeReceipt()"><i class="fas fa-times"></i> Remove</button>
            </div>
            <div class="input-group"><button id="addExpenseBtn"><i class="fas fa-plus"></i> Add Expense</button></div>
          </div>
          <div class="card">
            <h3><i class="fas fa-list-ul"></i> All Expenses</h3>
            <div id="expenseList"></div>
          </div>
        </div>

        <div id="page-settlements" class="page">
          <div class="card">
            <h3><i class="fas fa-calculator"></i> Settlement</h3>
            <button id="calculateSettleBtn" class="btn-success" style="padding:10px 24px;border-radius:30px;border:none;color:#fff;font-weight:600;cursor:pointer;margin-bottom:16px;"><i class="fas fa-sync"></i> Calculate</button>
            <div id="settlementSummary" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;"></div>
            <div id="settlementTransactions"></div>
            <button id="downloadPdfBtn" class="btn-danger" style="margin-top:20px;padding:12px 28px;border:none;border-radius:30px;color:#fff;font-weight:700;cursor:pointer;"><i class="fas fa-file-pdf"></i> Download PDF</button>
          </div>
        </div>
      `;

      // ========== EVENT BINDING ==========
      document.querySelectorAll('.nav-tabs button').forEach(btn => {
        btn.addEventListener('click', function() { switchPage(this.dataset.page); });
      });

      document.getElementById('addParticipantBtn').addEventListener('click', addParticipant);
      document.getElementById('participantInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') addParticipant(); });
      document.getElementById('addPlaceBtn').addEventListener('click', addPlace);
      document.getElementById('searchPlaceBtn').addEventListener('click', searchPlace);
      document.getElementById('placeName').addEventListener('keypress', (e) => { if (e.key === 'Enter') searchPlace(); });
      document.getElementById('addExpenseBtn').addEventListener('click', addExpense);
      document.getElementById('updateTripBtn').addEventListener('click', updateTrip);
      document.getElementById('startNewTripBtn').addEventListener('click', startNewTrip);
      document.getElementById('calculateSettleBtn').addEventListener('click', calculateSettlements);
      document.getElementById('downloadPdfBtn').addEventListener('click', exportPDF);
      document.getElementById('trackLocationBtn').addEventListener('click', function() { startLiveTracking(); });
      document.getElementById('navToggleBtn').addEventListener('click', toggleNavigation);

      // Delegation
      document.getElementById('expenseList').addEventListener('click', function(e) {
        const target = e.target.closest('[data-action="removeExpense"]');
        if (target) { removeExpense(parseInt(target.dataset.idx)); }
      });
      document.getElementById('participantChips').addEventListener('click', function(e) {
        const target = e.target.closest('[data-action="removePart"]');
        if (target) { removeParticipant(target.dataset.name); }
      });
      document.getElementById('itineraryList').addEventListener('click', function(e) {
        const target = e.target.closest('[data-action="removeItin"]');
        if (target) { removeItinerary(parseInt(target.dataset.idx)); }
      });

      window.handleReceiptChange = handleReceiptChange;
      window.removeReceipt = removeReceipt;

      renderParticipants();
      renderItinerary();
      renderExpenses();
      updateStats();
      updateSelects();
      initMap();

      if (currentTripPin && !isSyncing) {
        startRealtimeListener(currentTripPin);
      }
    }

    // ======================================================
    // 14. AUTH EVENT BINDINGS (NO AUTH)
    // ======================================================
    document.getElementById('newTripBtn').addEventListener('click', function() {
      createNewTrip();
    });

    document.getElementById('joinTripBtn').addEventListener('click', function() {
      joinTrip();
    });

    document.getElementById('pinInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        document.getElementById('joinTripBtn').click();
      }
    });

    // Auto-join if pin stored in localStorage
    const savedPin = localStorage.getItem('tripPin');
    if (savedPin) {
      document.getElementById('pinInput').value = savedPin;
      setTimeout(() => {
        document.getElementById('joinTripBtn').click();
      }, 500);
    }

    // ======================================================
    // 15. SERVICE WORKER
    // ======================================================
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('SW registered.'))
        .catch(err => console.log('SW registration failed:', err));
    }

    // Run cleanup on page load
    cleanupExpiredTrips();
  </script>
</body>
</html>
